<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&family=Assistant:wght@400;500;600;700&display=swap">
  <style>*{box-sizing:border-box}body{margin:0;font-family:"Assistant",system-ui,sans-serif}a{color:#C21361}a:hover{color:#FF2A85}.i{width:1em;height:1em;display:block;flex:none}</style>
</helmet>

<div dir="rtl" style="width:390px;height:780px;background:#FBF3E9;color:#3A2A2E;font-family:'Assistant',sans-serif;display:flex;flex-direction:column;overflow:hidden">

  <!-- hero -->
  <div style="margin:14px 14px 0;background:linear-gradient(150deg,#FF4E97,#C21361);border-radius:26px;padding:18px;color:#fff;position:relative;overflow:hidden;box-shadow:0 16px 30px -16px rgba(194,19,97,.7)">
    <div style="position:absolute;left:-30px;top:-30px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.12)"></div>
    <div style="display:flex;align-items:center;gap:14px;position:relative">
      <div style="width:88px;height:88px;flex:none;filter:drop-shadow(0 6px 10px rgba(0,0,0,.25))">
        <svg viewBox="0 0 114 114" width="100%" height="100%" aria-label="קפי"><path d="M22 52 a35 35 0 0 1 70 0" fill="none" stroke="#F2F5FA" stroke-width="7"/><path d="M18 104 q0 -30 39 -30 q39 0 39 30 z" fill="#FFD84D"/><path d="M18 104 q0 -30 39 -30 l0 30 z" fill="#F0BC1E"/><ellipse cx="57" cy="52" rx="34" ry="31" fill="#C49A6C"/><ellipse cx="57" cy="52" rx="34" ry="31" fill="none" stroke="#A67C52" stroke-width="2"/><circle cx="27" cy="34" r="8" fill="#C49A6C" stroke="#A67C52" stroke-width="2"/><circle cx="87" cy="34" r="8" fill="#C49A6C" stroke="#A67C52" stroke-width="2"/><ellipse cx="57" cy="63" rx="20" ry="15" fill="#FDF6E3"/><path d="M40 46 q6 -7 12 0" fill="none" stroke="#2A1D1A" stroke-width="3.2" stroke-linecap="round"/><path d="M62 46 q6 -7 12 0" fill="none" stroke="#2A1D1A" stroke-width="3.2" stroke-linecap="round"/><ellipse cx="57" cy="55" rx="8" ry="5" fill="#5A3D2E"/><path d="M50 60 q7 9 14 0" fill="none" stroke="#2A1D1A" stroke-width="3" stroke-linecap="round"/><rect x="16" y="46" width="13" height="18" rx="6" fill="#38BDF8" stroke="#fff" stroke-width="2"/><rect x="85" y="46" width="13" height="18" rx="6" fill="#38BDF8" stroke="#fff" stroke-width="2"/></svg>
      </div>
      <div style="flex:1">
        <div style="font-family:'Rubik';font-weight:800;font-size:1.3rem;line-height:1.15">אהלן, מילי</div>
        <div style="font-weight:600;font-size:.9rem;opacity:.92;margin-top:2px">מוכנה למסע של היום?</div>
      </div>
      <!-- goal ring -->
      <div style="width:58px;height:58px;flex:none;position:relative">
        <svg viewBox="0 0 42 42" width="58" height="58"><circle cx="21" cy="21" r="17" fill="none" stroke="rgba(255,255,255,.25)" stroke-width="5"/><circle cx="21" cy="21" r="17" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-dasharray="107" stroke-dashoffset="80" transform="rotate(-90 21 21)"/></svg>
        <div style="position:absolute;inset:0;display:grid;place-items:center;font-family:'Rubik';font-weight:800;font-size:.8rem">0/4</div>
      </div>
    </div>
  </div>

  <div style="padding:16px 14px 4px;font-family:'Rubik';font-weight:700;font-size:1rem">התחנות של היום</div>

  <!-- horizontal stepper -->
  <div style="display:flex;gap:12px;padding:6px 14px 14px;overflow-x:auto">
    <div style="flex:none;width:132px;background:#FFFDF8;border:2px solid #FF2A85;border-radius:20px;padding:14px;box-shadow:0 10px 22px -14px rgba(255,42,133,.5)">
      <div style="width:50px;height:50px;border-radius:15px;display:grid;place-items:center;color:#fff;background:linear-gradient(160deg,#FF5AA6,#FF2A85);margin-bottom:10px"><svg class="i" style="font-size:26px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="3"/><line x1="8" y1="7.5" x2="16" y2="7.5"/><line x1="8.5" y1="12" x2="8.6" y2="12"/><line x1="12" y1="12" x2="12.1" y2="12"/><line x1="15.5" y1="12" x2="15.6" y2="12"/></svg></div>
      <div style="font-family:'Rubik';font-weight:700;font-size:.95rem">חשבון</div>
      <div style="font-size:.74rem;color:#8A7668;font-weight:600;margin-top:2px">חובה · 2 דק׳</div>
    </div>
    <div style="flex:none;width:132px;background:#FFFDF8;border:1px solid #EBDDCB;border-radius:20px;padding:14px">
      <div style="width:50px;height:50px;border-radius:15px;display:grid;place-items:center;color:#fff;background:linear-gradient(160deg,#6DD3FB,#38BDF8);margin-bottom:10px"><svg class="i" style="font-size:24px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6H8a2 2 0 0 0-2 2v5a2 2 0 0 0 2 2h1v3l4-3h7a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2z"/><line x1="10" y1="10.5" x2="18" y2="10.5"/></svg></div>
      <div style="font-family:'Rubik';font-weight:700;font-size:.95rem">ערבית</div>
      <div style="font-size:.74rem;color:#8A7668;font-weight:600;margin-top:2px">שפות · 2 דק׳</div>
    </div>
    <div style="flex:none;width:132px;background:#FFFDF8;border:1px solid #EBDDCB;border-radius:20px;padding:14px">
      <div style="width:50px;height:50px;border-radius:15px;display:grid;place-items:center;color:#fff;background:linear-gradient(160deg,#F6D24A,#E0A800);margin-bottom:10px"><svg class="i" style="font-size:24px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c2.6 2 3.8 5.4 3.8 8.4l-3.8 2.8-3.8-2.8C8.2 8.4 9.4 5 12 3z"/><path d="M9 14.5l-2 4M15 14.5l2 4"/><circle cx="12" cy="9" r="1.4"/></svg></div>
      <div style="font-family:'Rubik';font-weight:700;font-size:.95rem">שער העתיד</div>
      <div style="font-size:.74rem;color:#8A7668;font-weight:600;margin-top:2px">העשרה · 2 דק׳</div>
    </div>
    <div style="flex:none;width:132px;background:#FFFDF8;border:1px solid #EBDDCB;border-radius:20px;padding:14px">
      <div style="width:50px;height:50px;border-radius:15px;display:grid;place-items:center;color:#fff;background:linear-gradient(160deg,#C9A87F,#A67C52);margin-bottom:10px"><svg class="i" style="font-size:24px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-6.5-4.2-6.5-9A3.3 3.3 0 0 1 12 8a3.3 3.3 0 0 1 6.5 3c0 4.8-6.5 9-6.5 9z"/></svg></div>
      <div style="font-family:'Rubik';font-weight:700;font-size:.95rem">בנק הלב</div>
      <div style="font-size:.74rem;color:#8A7668;font-weight:600;margin-top:2px">מנהיגות · 1 דק׳</div>
    </div>
  </div>

  <!-- stat strip -->
  <div style="display:flex;gap:12px;padding:4px 14px 8px">
    <div style="flex:1;background:#FFFDF8;border:1px solid #EBDDCB;border-radius:16px;padding:12px 14px;display:flex;align-items:center;gap:10px">
      <svg class="i" style="font-size:22px;color:#946A00" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.4"/></svg>
      <div><div style="font-family:'Rubik';font-weight:800;font-size:1.1rem">120</div><div style="font-size:.7rem;color:#8A7668;font-weight:600">מטבעות</div></div>
    </div>
    <div style="flex:1;background:#FFFDF8;border:1px solid #EBDDCB;border-radius:16px;padding:12px 14px;display:flex;align-items:center;gap:10px">
      <svg class="i" style="font-size:22px;color:#C21361" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3c1.4 3 4 4.2 4 7.5a4 4 0 0 1-8 0c0-1.6.7-2.8 1.6-3.7.2 1.7 1.9 1.8 1.9.2 0-1.7-.2-2.8.5-4z"/></svg>
      <div><div style="font-family:'Rubik';font-weight:800;font-size:1.1rem">6</div><div style="font-size:.7rem;color:#8A7668;font-weight:600">ימי רצף</div></div>
    </div>
  </div>

  <div style="margin-top:auto;display:flex;border-top:1px solid #EBDDCB;background:#FFFDF8">
    <div style="flex:1;padding:9px 4px 11px;display:flex;flex-direction:column;align-items:center;gap:3px;color:#C21361;font-family:'Rubik';font-weight:600;font-size:.72rem"><svg class="i" style="font-size:21px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4L4 6v14l5-2 6 2 5-2V4l-5 2-6-2z"/><line x1="9" y1="4" x2="9" y2="18"/><line x1="15" y1="6" x2="15" y2="20"/></svg>מסע</div>
    <div style="flex:1;padding:9px 4px 11px;display:flex;flex-direction:column;align-items:center;gap:3px;color:#8A7668;font-family:'Rubik';font-weight:600;font-size:.72rem"><svg class="i" style="font-size:21px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="5" y1="20" x2="5" y2="11"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="19" y1="20" x2="19" y2="14"/></svg>המצב שלי</div>
    <div style="flex:1;padding:9px 4px 11px;display:flex;flex-direction:column;align-items:center;gap:3px;color:#8A7668;font-family:'Rubik';font-weight:600;font-size:.72rem"><svg class="i" style="font-size:21px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="9" width="16" height="11" rx="1"/><line x1="4" y1="13" x2="20" y2="13"/><line x1="12" y1="9" x2="12" y2="20"/><path d="M12 9C11 6 8 6 8 8s3 1 4 1zM12 9c1-3 4-3 4-1s-3 1-4 1z"/></svg>חנות</div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic{ renderVals(){ return {}; } }
</script>
</body>
</html>
