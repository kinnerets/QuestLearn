<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&family=Assistant:wght@400;500;600;700&display=swap">
  <style>*{box-sizing:border-box}body{margin:0;font-family:"Assistant",system-ui,sans-serif}a{color:#C21361}a:hover{color:#FF2A85}.i{width:1em;height:1em;display:block;flex:none}</style>
</helmet>

<div dir="rtl" style="width:390px;height:780px;background:#FDF8F1;color:#3A2A2E;font-family:'Assistant',sans-serif;display:flex;flex-direction:column;overflow:hidden">

  <!-- minimal top -->
  <div style="padding:20px 20px 8px;display:flex;align-items:center">
    <div>
      <div style="font-family:'Rubik';font-weight:800;font-size:1.15rem">היי מילי</div>
      <div style="font-size:.82rem;color:#8A7668;font-weight:600">תחנה 1 מתוך 4 היום</div>
    </div>
    <div style="margin-inline-start:auto;display:flex;gap:7px">
      <div style="display:flex;align-items:center;gap:5px;background:#FFFDF8;border:1px solid #EBDDCB;border-radius:99px;padding:6px 10px;font-family:'Rubik';font-weight:700;font-size:.82rem;color:#946A00"><svg class="i" style="font-size:13px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.4"/></svg>120</div>
      <div style="display:flex;align-items:center;gap:5px;background:#FFFDF8;border:1px solid #EBDDCB;border-radius:99px;padding:6px 10px;font-family:'Rubik';font-weight:700;font-size:.82rem;color:#C21361"><svg class="i" style="font-size:13px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3c1.4 3 4 4.2 4 7.5a4 4 0 0 1-8 0c0-1.6.7-2.8 1.6-3.7.2 1.7 1.9 1.8 1.9.2 0-1.7-.2-2.8.5-4z"/></svg>6</div>
    </div>
  </div>

  <!-- day dots -->
  <div style="display:flex;gap:6px;padding:6px 20px 0">
    <span style="flex:1;height:6px;border-radius:99px;background:#FF2A85"></span>
    <span style="flex:1;height:6px;border-radius:99px;background:#EBDDCB"></span>
    <span style="flex:1;height:6px;border-radius:99px;background:#EBDDCB"></span>
    <span style="flex:1;height:6px;border-radius:99px;background:#EBDDCB"></span>
  </div>

  <!-- big focus card -->
  <div style="flex:1;display:flex;flex-direction:column;justify-content:center;padding:16px 20px">
    <div style="background:#FFFDF8;border:1px solid #EBDDCB;border-radius:30px;padding:26px 22px;text-align:center;box-shadow:0 20px 44px -24px rgba(58,42,46,.5)">
      <div style="width:96px;height:96px;border-radius:30px;display:grid;place-items:center;color:#fff;margin:0 auto 18px;background:linear-gradient(160deg,#FF5AA6,#FF2A85);box-shadow:0 14px 26px -12px rgba(255,42,133,.7)">
        <svg class="i" style="font-size:48px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="3"/><line x1="8" y1="7.5" x2="16" y2="7.5"/><line x1="8.5" y1="12" x2="8.6" y2="12"/><line x1="12" y1="12" x2="12.1" y2="12"/><line x1="15.5" y1="12" x2="15.6" y2="12"/><line x1="8.5" y1="16" x2="8.6" y2="16"/><line x1="12" y1="16" x2="12.1" y2="16"/><line x1="15.5" y1="16" x2="15.6" y2="16"/></svg>
      </div>
      <div style="font-family:'Rubik';font-weight:700;font-size:.7rem;letter-spacing:.12em;color:#8A7668">המשימה הבאה</div>
      <div style="font-family:'Rubik';font-weight:800;font-size:1.55rem;margin:6px 0 4px">חשבון · לוח הכפל</div>
      <div style="color:#8A7668;font-weight:600;font-size:.9rem">2 דקות · +10 מטבעות</div>
      <div style="margin-top:20px;background:#FF2A85;color:#fff;border-radius:16px;padding:15px;font-family:'Rubik';font-weight:700;font-size:1.1rem;box-shadow:0 12px 24px -12px #FF2A85">בואי נתחיל</div>
    </div>

    <!-- upcoming mini -->
    <div style="display:flex;justify-content:center;gap:18px;margin-top:22px">
      <div style="display:flex;flex-direction:column;align-items:center;gap:5px;opacity:.75">
        <div style="width:46px;height:46px;border-radius:15px;display:grid;place-items:center;color:#fff;background:#8FD4F5"><svg class="i" style="font-size:22px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6H8a2 2 0 0 0-2 2v5a2 2 0 0 0 2 2h1v3l4-3h7a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2z"/></svg></div>
        <span style="font-size:.72rem;color:#8A7668;font-weight:600">ערבית</span>
      </div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:5px;opacity:.75">
        <div style="width:46px;height:46px;border-radius:15px;display:grid;place-items:center;color:#fff;background:#F2CE64"><svg class="i" style="font-size:22px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c2.6 2 3.8 5.4 3.8 8.4l-3.8 2.8-3.8-2.8C8.2 8.4 9.4 5 12 3z"/><circle cx="12" cy="9" r="1.4"/></svg></div>
        <span style="font-size:.72rem;color:#8A7668;font-weight:600">העתיד</span>
      </div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:5px;opacity:.75">
        <div style="width:46px;height:46px;border-radius:15px;display:grid;place-items:center;color:#fff;background:#CBA981"><svg class="i" style="font-size:22px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-6.5-4.2-6.5-9A3.3 3.3 0 0 1 12 8a3.3 3.3 0 0 1 6.5 3c0 4.8-6.5 9-6.5 9z"/></svg></div>
        <span style="font-size:.72rem;color:#8A7668;font-weight:600">בנק הלב</span>
      </div>
    </div>
  </div>

  <div style="display:flex;border-top:1px solid #EBDDCB;background:#FFFDF8">
    <div style="flex:1;padding:9px 4px 11px;display:flex;flex-direction:column;align-items:center;gap:3px;color:#C21361;font-family:'Rubik';font-weight:600;font-size:.72rem"><svg class="i" style="font-size:21px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4L4 6v14l5-2 6 2 5-2V4l-5 2-6-2z"/><line x1="9" y1="4" x2="9" y2="18"/><line x1="15" y1="6" x2="15" y2="20"/></svg>מסע</div>
    <div style="flex:1;padding:9px 4px 11px;display:flex;flex-direction:column;align-items:center;gap:3px;color:#8A7668;font-family:'Rubik';font-weight:600;font-size:.72rem"><svg class="i" style="font-size:21px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="5" y1="20" x2="5" y2="11"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="19" y1="20" x2="19" y2="14"/></svg>המצב שלי</div>
    <div style="flex:1;padding:9px 4px 11px;display:flex;flex-direction:column;align-items:center;gap:3px;color:#8A7668;font-family:'Rubik';font-weight:600;font-size:.72rem"><svg class="i" style="font-size:21px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="9" width="16" height="11" rx="1"/><line x1="4" y1="13" x2="20" y2="13"/><line x1="12" y1="9" x2="12" y2="20"/><path d="M12 9C11 6 8 6 8 8s3 1 4 1zM12 9c1-3 4-3 4-1s-3 1-4 1z"/></svg>חנות</div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic{ renderVals(){ return {}; } }
</script>
</body>
</html>
