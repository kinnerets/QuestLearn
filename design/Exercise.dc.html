<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&family=Assistant:wght@400;500;600;700&display=swap">
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:"Assistant",system-ui,sans-serif}
    a{color:#C21361}a:hover{color:#FF2A85}
    .i{width:1em;height:1em;display:block;flex:none}
  </style>
</helmet>

<div dir="rtl" style="width:390px;height:780px;background:#FBF3E9;color:#3A2A2E;font-family:'Assistant',sans-serif;display:flex;flex-direction:column;overflow:hidden">

  <!-- appbar -->
  <div style="padding:16px 16px 12px;display:flex;align-items:center;gap:12px;background:linear-gradient(180deg,#FFE3F0,#FFFDF8);border-bottom:1px solid #EBDDCB">
    <div style="width:46px;height:46px;border-radius:14px;overflow:hidden;border:2px solid #FFFDF8;box-shadow:0 4px 10px -3px #FF2A85">
      <svg viewBox="0 0 46 46" width="100%" height="100%" aria-label="אווטאר">
        <rect width="46" height="46" rx="14" fill="#FF7FB2"/><circle cx="23" cy="24" r="9.5" fill="#FBE3CE"/>
        <path d="M12 22c0-8 5-11 11-11s11 3 11 11c-2-3-5-4-11-4s-9 1-11 4z" fill="#5A3D2E"/>
        <circle cx="19.5" cy="24" r="1.4" fill="#3A2A2E"/><circle cx="26.5" cy="24" r="1.4" fill="#3A2A2E"/>
        <path d="M20 28q3 2.4 6 0" fill="none" stroke="#C2506E" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
    </div>
    <div style="line-height:1.1"><div style="font-family:'Rubik';font-weight:700;font-size:1rem">מילי</div><div style="font-size:.76rem;color:#8A7668;font-weight:600">כיתה ג׳</div></div>
    <div style="display:flex;gap:8px;margin-inline-start:auto">
      <div style="display:flex;align-items:center;gap:5px;background:#FEF3C7;border:1px solid #EBDDCB;border-radius:99px;padding:6px 11px;font-family:'Rubik';font-weight:700;font-size:.9rem;color:#946A00"><svg class="i" style="font-size:15px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.4"/></svg>130</div>
      <div style="display:flex;align-items:center;gap:5px;background:#FFE3F0;border:1px solid #EBDDCB;border-radius:99px;padding:6px 11px;font-family:'Rubik';font-weight:700;font-size:.9rem;color:#C21361"><svg class="i" style="font-size:15px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3c1.4 3 4 4.2 4 7.5a4 4 0 0 1-8 0c0-1.6.7-2.8 1.6-3.7.2 1.7 1.9 1.8 1.9.2 0-1.7-.2-2.8.5-4z"/></svg>6</div>
    </div>
  </div>

  <!-- content -->
  <div style="flex:1;padding:16px;display:flex;flex-direction:column;overflow:hidden">
    <div style="display:flex;align-items:center;margin:0 2px 10px">
      <span style="font-family:'Rubik';font-weight:700;font-size:1.05rem">חשבון</span>
      <span style="margin-inline-start:auto;font-weight:600;color:#8A7668;font-size:.8rem">תחנה 1 מתוך 4</span>
    </div>

    <!-- question card -->
    <div style="background:#FDF6E3;border:1px solid #EBDDCB;border-radius:22px;padding:16px;margin-bottom:12px;box-shadow:0 8px 20px -14px rgba(0,0,0,.35)">
      <div style="font-family:'Rubik';font-weight:700;font-size:.68rem;letter-spacing:.1em;color:#8A7668">כפל</div>
      <div style="font-family:'Rubik';font-weight:700;font-size:1.4rem;margin-top:6px">כמה זה 7 × 6 ?</div>
    </div>

    <!-- answers -->
    <div style="display:grid;gap:10px">
      <div style="background:#FFFDF8;border:2px solid #EBDDCB;border-radius:16px;padding:14px 16px;font-family:'Rubik';font-weight:600;font-size:1.1rem">42</div>
      <div style="background:#FFF0F6;border:2px solid #FF2A85;border-radius:16px;padding:14px 16px;font-family:'Rubik';font-weight:600;font-size:1.1rem;display:flex;justify-content:space-between;align-items:center">48
        <svg class="i" style="font-size:20px;color:#FF2A85" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="7" y1="7" x2="17" y2="17"/><line x1="17" y1="7" x2="7" y2="17"/></svg>
      </div>
      <div style="background:#FFFDF8;border:2px solid #EBDDCB;border-radius:16px;padding:14px 16px;font-family:'Rubik';font-weight:600;font-size:1.1rem">36</div>
      <div style="background:#FFFDF8;border:2px solid #EBDDCB;border-radius:16px;padding:14px 16px;font-family:'Rubik';font-weight:600;font-size:1.1rem">40</div>
    </div>

    <!-- capi hint (glasses up) -->
    <div style="display:flex;align-items:flex-end;gap:10px;margin-top:16px">
      <div style="width:72px;height:72px;flex:none">
        <svg viewBox="0 0 114 114" width="100%" height="100%" aria-label="קפי נותנת רמז">
          <path d="M22 52 a35 35 0 0 1 70 0" fill="none" stroke="#F2F5FA" stroke-width="7"/>
          <path d="M18 104 q0 -30 39 -30 q39 0 39 30 z" fill="#FF2A85"/>
          <path d="M18 104 q0 -30 39 -30 l0 30 z" fill="#E01f72"/>
          <ellipse cx="57" cy="52" rx="34" ry="31" fill="#C49A6C"/>
          <ellipse cx="57" cy="52" rx="34" ry="31" fill="none" stroke="#A67C52" stroke-width="2"/>
          <circle cx="27" cy="34" r="8" fill="#C49A6C" stroke="#A67C52" stroke-width="2"/>
          <circle cx="87" cy="34" r="8" fill="#C49A6C" stroke="#A67C52" stroke-width="2"/>
          <g><rect x="34" y="24" width="46" height="9" rx="4" fill="#38BDF8" opacity=".85"/><rect x="34" y="26" width="20" height="7" rx="3" fill="#7ad4ff"/></g>
          <ellipse cx="57" cy="63" rx="20" ry="15" fill="#FDF6E3"/>
          <path d="M40 47 q6 4 12 0" fill="none" stroke="#2A1D1A" stroke-width="3.4" stroke-linecap="round"/>
          <path d="M62 47 q6 4 12 0" fill="none" stroke="#2A1D1A" stroke-width="3.4" stroke-linecap="round"/>
          <ellipse cx="57" cy="55" rx="8" ry="5" fill="#5A3D2E"/>
          <path d="M52 60 q5 4 10 0" fill="none" stroke="#2A1D1A" stroke-width="2.8" stroke-linecap="round"/>
          <rect x="16" y="46" width="13" height="18" rx="6" fill="#FF2A85" stroke="#fff" stroke-width="2"/>
          <rect x="85" y="46" width="13" height="18" rx="6" fill="#FF2A85" stroke="#fff" stroke-width="2"/>
        </svg>
      </div>
      <div style="background:#FDF6E3;border:1px solid #EBDDCB;border-radius:18px 18px 18px 5px;padding:10px 13px;font-size:.9rem;line-height:1.4;font-weight:600;flex:1">כמעט. נסי לספור בקפיצות של 7: 7, 14, 21, 28… עד שש קפיצות. איפה נוחתים?</div>
    </div>

    <div style="margin-top:auto"></div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic{ renderVals(){ return {}; } }
</script>
</body>
</html>
