<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&family=Assistant:wght@400;500;600;700&display=swap">
  <style>*{box-sizing:border-box}body{margin:0;font-family:"Assistant",system-ui,sans-serif}a{color:#C21361}a:hover{color:#FF2A85}.i{width:1em;height:1em;display:block;flex:none}</style>
</helmet>

<div dir="rtl" style="width:390px;height:780px;background:#FBF3E9;color:#3A2A2E;font-family:'Assistant',sans-serif;display:flex;flex-direction:column;overflow:hidden">
  <div style="padding:16px 16px 12px;display:flex;align-items:center;gap:12px;background:linear-gradient(180deg,#F3E7D8,#FFFDF8);border-bottom:1px solid #EBDDCB">
    <div style="width:46px;height:46px;border-radius:14px;overflow:hidden;border:2px solid #FFFDF8;box-shadow:0 4px 10px -3px #A67C52">
      <svg viewBox="0 0 64 64" width="100%" height="100%" aria-label="אווטאר"><rect width="64" height="64" rx="18" fill="#FFE0EC"/><path d="M16 34 C16 18 24 13 32 13 C40 13 48 18 48 34 L48 50 L42 50 L42 34 C42 30 38 27 32 27 C26 27 22 30 22 34 L22 50 L16 50 Z" fill="#7A4B2B"/><circle cx="32" cy="32" r="13" fill="#FCE0C8"/><path d="M20 27 C22 21 27 19 32 19 C37 19 42 21 44 27 C40 24 36 23 32 23 C28 23 24 24 20 27 Z" fill="#7A4B2B"/><circle cx="25" cy="35" r="3" fill="#FF9FBE" opacity=".5"/><circle cx="39" cy="35" r="3" fill="#FF9FBE" opacity=".5"/><circle cx="27" cy="31" r="2.4" fill="#3A2A2E"/><circle cx="37" cy="31" r="2.4" fill="#3A2A2E"/><circle cx="27.7" cy="30.3" r=".7" fill="#fff"/><circle cx="37.7" cy="30.3" r=".7" fill="#fff"/><path d="M28 37 q4 3 8 0" fill="none" stroke="#C2506E" stroke-width="1.8" stroke-linecap="round"/><path d="M42 20 l4 -2 0 4 z" fill="#FF2A85"/><path d="M42 20 l4 2 0 -4 z" fill="#FF2A85"/><circle cx="42" cy="20" r="1.6" fill="#C21361"/></svg>
    </div>
    <div style="line-height:1.1"><div style="font-family:'Rubik';font-weight:700;font-size:1rem">מילי</div><div style="font-size:.76rem;color:#8A7668;font-weight:600">כיתה ג׳</div></div>
    <div style="display:flex;gap:8px;margin-inline-start:auto">
      <div style="display:flex;align-items:center;gap:5px;background:#FEF3C7;border:1px solid #EBDDCB;border-radius:99px;padding:6px 11px;font-family:'Rubik';font-weight:700;font-size:.9rem;color:#946A00"><svg class="i" style="font-size:15px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.4"/></svg>150</div>
    </div>
  </div>

  <div style="flex:1;padding:16px;display:flex;flex-direction:column;overflow:hidden">
    <div style="display:flex;align-items:center;margin:0 2px 10px">
      <span style="font-family:'Rubik';font-weight:700;font-size:1.05rem">בנק הלב</span>
      <span style="margin-inline-start:auto;font-weight:600;color:#8A7668;font-size:.8rem">אי המצפן · מנהיגות</span>
    </div>

    <!-- heart balance -->
    <div style="display:flex;align-items:center;gap:10px;background:#FDF6E3;border:1px solid #EBDDCB;border-radius:14px;padding:10px 12px;margin-bottom:12px;font-weight:600;font-size:.9rem">
      <span style="display:flex;align-items:center;gap:6px;color:#C21361"><svg class="i" style="font-size:18px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-6.5-4.2-6.5-9A3.3 3.3 0 0 1 12 8a3.3 3.3 0 0 1 6.5 3c0 4.8-6.5 9-6.5 9z"/></svg> יתרת הלב שלך</span>
      <div style="flex:1;height:10px;border-radius:99px;background:#EBDDCB;overflow:hidden"><i style="display:block;height:100%;width:78%;border-radius:99px;background:linear-gradient(90deg,#FF6FA6,#FF2A85)"></i></div>
    </div>

    <!-- deposit card -->
    <div style="background:#FDF6E3;border:1px solid #EBDDCB;border-radius:22px;padding:16px;margin-bottom:12px">
      <div style="font-family:'Rubik';font-weight:700;font-size:.68rem;letter-spacing:.1em;color:#8A7668">ההפקדה של היום</div>
      <div style="font-family:'Rubik';font-weight:700;font-size:1.12rem;margin-top:6px">מה תעשי היום בשביל מישהו אחר?</div>
      <div style="color:#8A7668;font-weight:600;font-size:.85rem;margin-top:4px">אין כאן תשובה נכונה — כל בחירה היא הפקדה טובה ללב.</div>
    </div>

    <!-- choices -->
    <div style="display:grid;gap:10px">
      <div style="display:flex;align-items:center;gap:12px;background:#F6ECDC;border:2px solid #A67C52;border-radius:16px;padding:13px 15px;font-weight:600">
        <span style="width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:#EFE0C7;color:#A67C52"><svg class="i" style="font-size:20px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4l2.2 4.6 5 .7-3.6 3.6.9 5-4.5-2.4L7.5 18l.9-5L4.8 9.3l5-.7z"/></svg></span>
        לפרגן לחברה על משהו
      </div>
      <div style="display:flex;align-items:center;gap:12px;background:#FFFDF8;border:2px solid #EBDDCB;border-radius:16px;padding:13px 15px;font-weight:600">
        <span style="width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:#F6ECDC;color:#A67C52"><svg class="i" style="font-size:20px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-6 8 6"/><path d="M6 10v9h12v-9"/></svg></span>
        לעזור במשהו בבית
      </div>
      <div style="display:flex;align-items:center;gap:12px;background:#FFFDF8;border:2px solid #EBDDCB;border-radius:16px;padding:13px 15px;font-weight:600">
        <span style="width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:#F6ECDC;color:#A67C52"><svg class="i" style="font-size:20px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 9a3.5 3.5 0 1 1 7 0c0 3-3 3-3 5.5a2 2 0 0 1-4 0"/><path d="M17.5 6.5c1.2 1 1.8 2.3 1.8 3.8"/></svg></span>
        להקשיב לחברה בלי להפריע
      </div>
    </div>

    <!-- capi coach -->
    <div style="display:flex;align-items:flex-end;gap:10px;margin-top:16px">
      <div style="width:72px;height:72px;flex:none">
        <svg viewBox="0 0 114 114" width="100%" height="100%" aria-label="קפי מאמנת"><path d="M22 52 a35 35 0 0 1 70 0" fill="none" stroke="#F2F5FA" stroke-width="7"/><path d="M18 104 q0 -30 39 -30 q39 0 39 30 z" fill="#FF2A85"/><path d="M18 104 q0 -30 39 -30 l0 30 z" fill="#E01f72"/><ellipse cx="57" cy="52" rx="34" ry="31" fill="#C49A6C"/><ellipse cx="57" cy="52" rx="34" ry="31" fill="none" stroke="#A67C52" stroke-width="2"/><circle cx="27" cy="34" r="8" fill="#C49A6C" stroke="#A67C52" stroke-width="2"/><circle cx="87" cy="34" r="8" fill="#C49A6C" stroke="#A67C52" stroke-width="2"/><ellipse cx="57" cy="63" rx="20" ry="15" fill="#FDF6E3"/><path d="M40 46 q6 -7 12 0" fill="none" stroke="#2A1D1A" stroke-width="3.2" stroke-linecap="round"/><path d="M62 46 q6 -7 12 0" fill="none" stroke="#2A1D1A" stroke-width="3.2" stroke-linecap="round"/><ellipse cx="57" cy="55" rx="8" ry="5" fill="#5A3D2E"/><path d="M50 60 q7 9 14 0" fill="none" stroke="#2A1D1A" stroke-width="3" stroke-linecap="round"/><rect x="16" y="46" width="13" height="18" rx="6" fill="#FF2A85" stroke="#fff" stroke-width="2"/><rect x="85" y="46" width="13" height="18" rx="6" fill="#FF2A85" stroke="#fff" stroke-width="2"/></svg>
      </div>
      <div style="background:#FDF6E3;border:1px solid #EBDDCB;border-radius:18px 18px 18px 5px;padding:10px 13px;font-size:.9rem;line-height:1.4;font-weight:600;flex:1">הפקדה יפה — ככה נבנית מנהיגת אמת.</div>
    </div>
    <div style="margin-top:auto"></div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic{ renderVals(){ return {}; } }
</script>
</body>
</html>
