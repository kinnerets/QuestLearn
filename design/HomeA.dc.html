<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&family=Assistant:wght@400;500;600;700&display=swap">
  <style>*{box-sizing:border-box}body{margin:0;font-family:"Assistant",system-ui,sans-serif}a{color:#C21361}a:hover{color:#FF2A85}.i{width:1em;height:1em;display:block;flex:none}</style>
</helmet>

<div dir="rtl" style="width:390px;height:780px;background:linear-gradient(180deg,#EAF6FF,#FBF3E9 42%);color:#3A2A2E;font-family:'Assistant',sans-serif;display:flex;flex-direction:column;overflow:hidden">

  <!-- appbar -->
  <div style="padding:16px 16px 10px;display:flex;align-items:center;gap:12px">
    <div style="width:44px;height:44px;border-radius:14px;overflow:hidden;box-shadow:0 4px 10px -4px #FF2A85">
      <svg viewBox="0 0 64 64" width="100%" height="100%" aria-label="אווטאר"><rect width="64" height="64" rx="18" fill="#FFE0EC"/><path d="M16 34 C16 18 24 13 32 13 C40 13 48 18 48 34 L48 50 L42 50 L42 34 C42 30 38 27 32 27 C26 27 22 30 22 34 L22 50 L16 50 Z" fill="#7A4B2B"/><circle cx="32" cy="32" r="13" fill="#FCE0C8"/><path d="M20 27 C22 21 27 19 32 19 C37 19 42 21 44 27 C40 24 36 23 32 23 C28 23 24 24 20 27 Z" fill="#7A4B2B"/><circle cx="25" cy="35" r="3" fill="#FF9FBE" opacity=".5"/><circle cx="39" cy="35" r="3" fill="#FF9FBE" opacity=".5"/><circle cx="27" cy="31" r="2.4" fill="#3A2A2E"/><circle cx="37" cy="31" r="2.4" fill="#3A2A2E"/><circle cx="27.7" cy="30.3" r=".7" fill="#fff"/><circle cx="37.7" cy="30.3" r=".7" fill="#fff"/><path d="M28 37 q4 3 8 0" fill="none" stroke="#C2506E" stroke-width="1.8" stroke-linecap="round"/><path d="M42 20 l4 -2 0 4 z" fill="#FF2A85"/><path d="M42 20 l4 2 0 -4 z" fill="#FF2A85"/><circle cx="42" cy="20" r="1.6" fill="#C21361"/></svg>
    </div>
    <div style="line-height:1.1"><div style="font-family:'Rubik';font-weight:700;font-size:1rem">מילי</div><div style="font-size:.74rem;color:#8A7668;font-weight:600">כיתה ג׳</div></div>
    <div style="display:flex;gap:8px;margin-inline-start:auto">
      <div style="display:flex;align-items:center;gap:5px;background:#FFFDF8;border:1px solid #EBDDCB;border-radius:99px;padding:6px 11px;font-family:'Rubik';font-weight:700;font-size:.88rem;color:#946A00"><svg class="i" style="font-size:14px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.4"/></svg>120</div>
      <div style="display:flex;align-items:center;gap:5px;background:#FFFDF8;border:1px solid #EBDDCB;border-radius:99px;padding:6px 11px;font-family:'Rubik';font-weight:700;font-size:.88rem;color:#C21361"><svg class="i" style="font-size:14px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3c1.4 3 4 4.2 4 7.5a4 4 0 0 1-8 0c0-1.6.7-2.8 1.6-3.7.2 1.7 1.9 1.8 1.9.2 0-1.7-.2-2.8.5-4z"/></svg>6</div>
    </div>
  </div>

  <!-- map -->
  <div style="position:relative;flex:1;margin:0 6px">
    <!-- scenery -->
    <svg viewBox="0 0 360 470" preserveAspectRatio="none" style="position:absolute;inset:0;width:100%;height:100%" aria-hidden="true">
      <circle cx="300" cy="60" r="46" fill="#FFF3D6"/>
      <path d="M0 430 Q90 380 180 420 T360 410 V470 H0 Z" fill="#DDF0D8"/>
      <path d="M0 448 Q120 415 240 445 T360 440 V470 H0 Z" fill="#CDE8C6"/>
      <path d="M40,44 C 250,80 70,150 175,196 C 280,240 90,300 175,346 C 250,384 120,420 250,436" fill="none" stroke="#F2DDBE" stroke-width="16" stroke-linecap="round"/>
      <path d="M40,44 C 250,80 70,150 175,196 C 280,240 90,300 175,346 C 250,384 120,420 250,436" fill="none" stroke="#E7CBA8" stroke-width="16" stroke-linecap="round" stroke-dasharray="1 26"/>
    </svg>

    <!-- pods -->
    <div style="position:absolute;right:6%;top:5%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center;width:110px">
      <div style="width:76px;height:76px;border-radius:26px;display:grid;place-items:center;color:#fff;background:linear-gradient(160deg,#FF5AA6,#FF2A85);box-shadow:0 12px 22px -8px rgba(255,42,133,.6),0 0 0 6px rgba(255,42,133,.16),inset 0 -4px 0 rgba(0,0,0,.12)">
        <svg class="i" style="font-size:34px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="3"/><line x1="8" y1="7.5" x2="16" y2="7.5"/><line x1="8.5" y1="12" x2="8.6" y2="12"/><line x1="12" y1="12" x2="12.1" y2="12"/><line x1="15.5" y1="12" x2="15.6" y2="12"/><line x1="8.5" y1="16" x2="8.6" y2="16"/><line x1="12" y1="16" x2="12.1" y2="16"/><line x1="15.5" y1="16" x2="15.6" y2="16"/></svg>
      </div>
      <div style="font-family:'Rubik';font-weight:700;font-size:.8rem">חשבון</div>
    </div>
    <div style="position:absolute;right:52%;top:41%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center;width:110px">
      <div style="width:66px;height:66px;border-radius:22px;display:grid;place-items:center;color:#fff;background:linear-gradient(160deg,#6DD3FB,#38BDF8);box-shadow:0 10px 18px -8px rgba(56,189,248,.6),inset 0 -4px 0 rgba(0,0,0,.1)">
        <svg class="i" style="font-size:30px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6H8a2 2 0 0 0-2 2v5a2 2 0 0 0 2 2h1v3l4-3h7a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2z"/><line x1="10" y1="10.5" x2="18" y2="10.5"/></svg>
      </div>
      <div style="font-family:'Rubik';font-weight:700;font-size:.8rem;color:#8A7668">ערבית</div>
    </div>
    <div style="position:absolute;right:20%;top:72%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center;width:110px">
      <div style="width:66px;height:66px;border-radius:22px;display:grid;place-items:center;color:#fff;background:linear-gradient(160deg,#F6D24A,#E0A800);box-shadow:0 10px 18px -8px rgba(224,168,0,.55),inset 0 -4px 0 rgba(0,0,0,.1)">
        <svg class="i" style="font-size:30px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c2.6 2 3.8 5.4 3.8 8.4l-3.8 2.8-3.8-2.8C8.2 8.4 9.4 5 12 3z"/><path d="M9 14.5l-2 4M15 14.5l2 4"/><circle cx="12" cy="9" r="1.4"/></svg>
      </div>
      <div style="font-family:'Rubik';font-weight:700;font-size:.8rem;color:#8A7668">שער העתיד</div>
    </div>
    <div style="position:absolute;right:70%;top:93%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center;width:110px">
      <div style="width:66px;height:66px;border-radius:22px;display:grid;place-items:center;color:#fff;background:linear-gradient(160deg,#C9A87F,#A67C52);box-shadow:0 10px 18px -8px rgba(166,124,82,.5),inset 0 -4px 0 rgba(0,0,0,.1)">
        <svg class="i" style="font-size:30px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-6.5-4.2-6.5-9A3.3 3.3 0 0 1 12 8a3.3 3.3 0 0 1 6.5 3c0 4.8-6.5 9-6.5 9z"/></svg>
      </div>
      <div style="font-family:'Rubik';font-weight:700;font-size:.8rem;color:#8A7668">בנק הלב</div>
    </div>
  </div>

  <!-- capi -->
  <div style="display:flex;align-items:flex-end;gap:10px;padding:0 16px 12px">
    <div style="width:70px;height:70px;flex:none">
      <svg viewBox="0 0 114 114" width="100%" height="100%" aria-label="קפי"><path d="M22 52 a35 35 0 0 1 70 0" fill="none" stroke="#F2F5FA" stroke-width="7"/><path d="M18 104 q0 -30 39 -30 q39 0 39 30 z" fill="#FF2A85"/><path d="M18 104 q0 -30 39 -30 l0 30 z" fill="#E01f72"/><ellipse cx="57" cy="52" rx="34" ry="31" fill="#C49A6C"/><ellipse cx="57" cy="52" rx="34" ry="31" fill="none" stroke="#A67C52" stroke-width="2"/><circle cx="27" cy="34" r="8" fill="#C49A6C" stroke="#A67C52" stroke-width="2"/><circle cx="87" cy="34" r="8" fill="#C49A6C" stroke="#A67C52" stroke-width="2"/><ellipse cx="57" cy="63" rx="20" ry="15" fill="#FDF6E3"/><path d="M40 47 q6 4 12 0" fill="none" stroke="#2A1D1A" stroke-width="3.4" stroke-linecap="round"/><path d="M62 47 q6 4 12 0" fill="none" stroke="#2A1D1A" stroke-width="3.4" stroke-linecap="round"/><ellipse cx="57" cy="55" rx="8" ry="5" fill="#5A3D2E"/><path d="M52 60 q5 4 10 0" fill="none" stroke="#2A1D1A" stroke-width="2.8" stroke-linecap="round"/><rect x="16" y="46" width="13" height="18" rx="6" fill="#FF2A85" stroke="#fff" stroke-width="2"/><rect x="85" y="46" width="13" height="18" rx="6" fill="#FF2A85" stroke="#fff" stroke-width="2"/></svg>
    </div>
    <div style="background:#FFFDF8;border:1px solid #EBDDCB;border-radius:18px 18px 18px 5px;padding:10px 13px;font-size:.88rem;line-height:1.4;font-weight:600;flex:1;box-shadow:0 8px 18px -12px rgba(0,0,0,.4)">אהלן מילי. נתחיל ב<b style="color:#C21361">חשבון</b>?</div>
  </div>

  <!-- nav -->
  <div style="display:flex;border-top:1px solid #EBDDCB;background:#FFFDF8">
    <div style="flex:1;padding:9px 4px 11px;display:flex;flex-direction:column;align-items:center;gap:3px;color:#C21361;font-family:'Rubik';font-weight:600;font-size:.72rem"><svg class="i" style="font-size:21px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4L4 6v14l5-2 6 2 5-2V4l-5 2-6-2z"/><line x1="9" y1="4" x2="9" y2="18"/><line x1="15" y1="6" x2="15" y2="20"/></svg>מסע</div>
    <div style="flex:1;padding:9px 4px 11px;display:flex;flex-direction:column;align-items:center;gap:3px;color:#8A7668;font-family:'Rubik';font-weight:600;font-size:.72rem"><svg class="i" style="font-size:21px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="5" y1="20" x2="5" y2="11"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="19" y1="20" x2="19" y2="14"/></svg>המצב שלי</div>
    <div style="flex:1;padding:9px 4px 11px;display:flex;flex-direction:column;align-items:center;gap:3px;color:#8A7668;font-family:'Rubik';font-weight:600;font-size:.72rem"><svg class="i" style="font-size:21px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="9" width="16" height="11" rx="1"/><line x1="4" y1="13" x2="20" y2="13"/><line x1="12" y1="9" x2="12" y2="20"/><path d="M12 9C11 6 8 6 8 8s3 1 4 1zM12 9c1-3 4-3 4-1s-3 1-4 1z"/></svg>חנות</div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic{ renderVals(){ return {}; } }
</script>
</body>
</html>
