<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&family=Assistant:wght@400;500;600;700&display=swap">
  <style>*{box-sizing:border-box}body{margin:0;font-family:"Assistant",system-ui,sans-serif}a{color:#C21361}a:hover{color:#FF2A85}.i{width:1em;height:1em;display:block;flex:none}</style>
</helmet>

<div dir="rtl" style="width:390px;height:780px;background:#F7F2EC;color:#3A2A2E;font-family:'Assistant',sans-serif;display:flex;flex-direction:column;overflow:hidden">

  <!-- top bar -->
  <div style="padding:16px 16px 12px;display:flex;align-items:center;gap:12px;background:#FFFDF8;border-bottom:1px solid #EBDDCB">
    <span style="width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:#F4EFE8;color:#8A7668"><svg class="i" style="font-size:20px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></span>
    <span style="font-family:'Rubik';font-weight:800;font-size:1.1rem">עיצוב האווטאר שלי</span>
    <span style="margin-inline-start:auto;display:flex;align-items:center;gap:5px;background:#FEF3C7;border:1px solid #EBDDCB;border-radius:99px;padding:6px 11px;font-family:'Rubik';font-weight:700;font-size:.9rem;color:#946A00"><svg class="i" style="font-size:15px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.4"/></svg>120</span>
  </div>

  <!-- preview -->
  <div style="display:flex;justify-content:center;padding:16px 0 8px">
    <div style="width:184px;height:184px;border-radius:50%;background:radial-gradient(circle at 50% 35%,#FFE7F1,#FBE3CE);display:grid;place-items:end center;overflow:hidden;box-shadow:inset 0 -6px 16px -8px rgba(0,0,0,.12)">
      <svg viewBox="0 0 200 168" width="168" height="141" aria-label="האווטאר של מילי">
        <path d="M34 200 C34 156 62 138 100 138 C138 138 166 156 166 200 Z" fill="#FF2A85"/>
        <path d="M84 140 L100 156 L116 140 Z" fill="#E01f72"/>
        <path d="M88 118 h24 v16 a12 12 0 0 1 -24 0 Z" fill="#F3C9A3"/>
        <path d="M52 94 C52 52 74 34 100 34 C126 34 148 52 148 94 L148 152 C140 146 132 144 126 144 L74 144 C68 144 60 146 52 152 Z" fill="#7A4B2B"/>
        <circle cx="62" cy="98" r="9" fill="#FCE0C8"/><circle cx="138" cy="98" r="9" fill="#FCE0C8"/>
        <ellipse cx="100" cy="94" rx="40" ry="44" fill="#FCE0C8"/>
        <path d="M60 82 C64 50 82 40 100 40 C118 40 136 50 140 82 C128 66 116 60 100 60 C84 60 72 66 60 82 Z" fill="#7A4B2B"/>
        <path d="M76 86 q9 -5 18 -1" fill="none" stroke="#5A3D2E" stroke-width="3" stroke-linecap="round"/>
        <path d="M106 85 q9 -4 18 1" fill="none" stroke="#5A3D2E" stroke-width="3" stroke-linecap="round"/>
        <circle cx="84" cy="98" r="6" fill="#3A2A2E"/><circle cx="116" cy="98" r="6" fill="#3A2A2E"/>
        <circle cx="86" cy="96" r="2" fill="#fff"/><circle cx="118" cy="96" r="2" fill="#fff"/>
        <ellipse cx="74" cy="110" rx="7" ry="4.5" fill="#FF9FBE" opacity=".55"/><ellipse cx="126" cy="110" rx="7" ry="4.5" fill="#FF9FBE" opacity=".55"/>
        <path d="M100 104 q3 4 0 7" fill="none" stroke="#E0B48C" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M86 116 q14 11 28 0" fill="none" stroke="#C2506E" stroke-width="3.4" stroke-linecap="round"/>
        <path d="M128 44 l14 -6 0 14 z" fill="#FF2A85"/><path d="M128 44 l14 6 0 -14 z" fill="#FF2A85"/><circle cx="128" cy="44" r="4.5" fill="#C21361"/>
      </svg>
    </div>
  </div>

  <!-- category tabs -->
  <div style="display:flex;gap:8px;padding:6px 14px 10px;overflow-x:auto">
    <span style="flex:none;background:#FF2A85;color:#fff;border-radius:12px;padding:8px 14px;font-family:'Rubik';font-weight:700;font-size:.86rem">שיער</span>
    <span style="flex:none;background:#FFFDF8;color:#8A7668;border:1px solid #EBDDCB;border-radius:12px;padding:8px 14px;font-family:'Rubik';font-weight:600;font-size:.86rem">גוון עור</span>
    <span style="flex:none;background:#FFFDF8;color:#8A7668;border:1px solid #EBDDCB;border-radius:12px;padding:8px 14px;font-family:'Rubik';font-weight:600;font-size:.86rem">לבוש</span>
    <span style="flex:none;background:#FFFDF8;color:#8A7668;border:1px solid #EBDDCB;border-radius:12px;padding:8px 14px;font-family:'Rubik';font-weight:600;font-size:.86rem">אביזרים</span>
  </div>

  <!-- hair colour row -->
  <div style="display:flex;gap:10px;padding:2px 16px 12px;align-items:center">
    <span style="font-family:'Rubik';font-weight:700;font-size:.78rem;color:#8A7668">צבע:</span>
    <span style="width:26px;height:26px;border-radius:50%;background:#7A4B2B;border:3px solid #FF2A85"></span>
    <span style="width:26px;height:26px;border-radius:50%;background:#2A2320;border:2px solid #EBDDCB"></span>
    <span style="width:26px;height:26px;border-radius:50%;background:#C98A3C;border:2px solid #EBDDCB"></span>
    <span style="width:26px;height:26px;border-radius:50%;background:#E4B23E;border:2px solid #EBDDCB"></span>
    <span style="width:26px;height:26px;border-radius:50%;background:#B0453A;border:2px solid #EBDDCB"></span>
  </div>

  <!-- options grid -->
  <div style="flex:1;padding:2px 14px 12px;overflow-y:auto">
    <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px">
      <!-- selected -->
      <div style="aspect-ratio:1;border-radius:18px;background:#FFF0F6;border:2px solid #FF2A85;display:grid;place-items:center"><svg viewBox="40 30 120 100" width="70%" aria-label="חלק ארוך"><path d="M52 94 C52 52 74 34 100 34 C126 34 148 52 148 94 L148 140 L128 140 L128 94 C128 68 116 60 100 60 C84 60 72 68 72 94 L72 140 L52 140 Z" fill="#7A4B2B"/><ellipse cx="100" cy="90" rx="30" ry="32" fill="#FCE0C8"/><path d="M64 80 C68 54 84 46 100 46 C116 46 132 54 136 80 C126 66 114 62 100 62 C86 62 74 66 64 80 Z" fill="#7A4B2B"/></svg></div>
      <div style="aspect-ratio:1;border-radius:18px;background:#FFFDF8;border:1px solid #EBDDCB;display:grid;place-items:center"><svg viewBox="40 30 120 100" width="70%" aria-label="קוקו"><ellipse cx="100" cy="90" rx="30" ry="32" fill="#FCE0C8"/><path d="M66 74 C70 50 86 44 100 44 C114 44 130 50 134 74 C124 62 112 58 100 58 C88 58 76 62 66 74 Z" fill="#7A4B2B"/><circle cx="140" cy="70" r="12" fill="#7A4B2B"/></svg></div>
      <div style="aspect-ratio:1;border-radius:18px;background:#FFFDF8;border:1px solid #EBDDCB;display:grid;place-items:center"><svg viewBox="40 30 120 100" width="70%" aria-label="בוב קצר"><path d="M60 96 C60 56 78 40 100 40 C122 40 140 56 140 96 L140 108 L120 108 L120 92 C120 74 112 66 100 66 C88 66 80 74 80 92 L80 108 L60 108 Z" fill="#2A2320"/><ellipse cx="100" cy="92" rx="28" ry="30" fill="#FCE0C8"/></svg></div>

      <!-- locked items -->
      <div style="aspect-ratio:1;border-radius:18px;background:#F4EFE8;border:1px solid #EBDDCB;display:grid;place-items:center;position:relative;opacity:.9">
        <svg viewBox="40 30 120 100" width="70%" style="filter:grayscale(.4) opacity(.7)" aria-label="צמות"><ellipse cx="100" cy="90" rx="30" ry="32" fill="#FCE0C8"/><path d="M66 76 C70 52 86 46 100 46 C114 46 130 52 134 76 C124 64 112 60 100 60 C88 60 76 64 66 76 Z" fill="#B0453A"/><path d="M70 92 q-6 24 4 40 q6 -18 2 -38 z" fill="#B0453A"/><path d="M130 92 q6 24 -4 40 q-6 -18 -2 -38 z" fill="#B0453A"/></svg>
        <span style="position:absolute;bottom:8px;display:flex;align-items:center;gap:3px;background:#FFFDF8;border:1px solid #EBDDCB;border-radius:99px;padding:2px 8px;font-family:'Rubik';font-weight:700;font-size:.72rem;color:#946A00"><svg class="i" style="font-size:12px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.4"/></svg>40</span>
      </div>
      <div style="aspect-ratio:1;border-radius:18px;background:#F4EFE8;border:1px solid #EBDDCB;display:grid;place-items:center;position:relative">
        <svg viewBox="40 30 120 100" width="70%" style="filter:grayscale(.4) opacity(.7)" aria-label="מתולתל"><ellipse cx="100" cy="90" rx="30" ry="32" fill="#FCE0C8"/><path d="M64 78 q-4 -30 36 -34 q40 4 36 34 q-8 -16 -36 -16 q-28 0 -36 16z" fill="#3A2A2E"/><circle cx="60" cy="96" r="10" fill="#3A2A2E"/><circle cx="140" cy="96" r="10" fill="#3A2A2E"/></svg>
        <span style="position:absolute;bottom:8px;display:flex;align-items:center;gap:3px;background:#FFFDF8;border:1px solid #EBDDCB;border-radius:99px;padding:2px 8px;font-family:'Rubik';font-weight:700;font-size:.72rem;color:#946A00"><svg class="i" style="font-size:12px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.4"/></svg>60</span>
      </div>
      <div style="aspect-ratio:1;border-radius:18px;background:#F4EFE8;border:1px solid #EBDDCB;display:grid;place-items:center;position:relative">
        <svg viewBox="40 30 120 100" width="70%" style="filter:grayscale(.4) opacity(.7)" aria-label="חד-קרן"><ellipse cx="100" cy="90" rx="30" ry="32" fill="#FCE0C8"/><path d="M66 76 C70 52 86 46 100 46 C114 46 130 52 134 76 C124 64 112 60 100 60 C88 60 76 64 66 76 Z" fill="#B57BD6"/><path d="M98 30 l4 16 -8 0 z" fill="#FACC15"/></svg>
        <span style="position:absolute;bottom:8px;display:flex;align-items:center;gap:3px;background:#FFFDF8;border:1px solid #EBDDCB;border-radius:99px;padding:2px 8px;font-family:'Rubik';font-weight:700;font-size:.72rem;color:#946A00"><svg class="i" style="font-size:12px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.4"/></svg>120</span>
      </div>
    </div>
  </div>

  <div style="padding:6px 16px 16px;background:#FFFDF8;border-top:1px solid #EBDDCB">
    <div style="width:100%;border-radius:16px;padding:15px;font-family:'Rubik';font-weight:700;font-size:1.05rem;background:#FF2A85;color:#fff;text-align:center;box-shadow:0 10px 22px -10px #FF2A85">שמור אווטאר</div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic{ renderVals(){ return {}; } }
</script>
</body>
</html>
