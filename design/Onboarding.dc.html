<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&family=Assistant:wght@400;500;600;700&display=swap">
  <style>*{box-sizing:border-box}body{margin:0;font-family:"Assistant",system-ui,sans-serif}a{color:#C21361}a:hover{color:#FF2A85}.i{width:1em;height:1em;display:block;flex:none}</style>
</helmet>

<div dir="rtl" style="width:390px;height:780px;background:radial-gradient(120% 55% at 50% 0%,#FFE3F0,#FBF3E9 55%);color:#3A2A2E;font-family:'Assistant',sans-serif;display:flex;flex-direction:column;overflow:hidden;padding:26px 20px 20px">

  <!-- greeting -->
  <div style="display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px">
    <div style="width:120px;height:120px">
      <svg viewBox="0 0 114 114" width="100%" height="100%" aria-label="קפי">
        <path d="M22 52 a35 35 0 0 1 70 0" fill="none" stroke="#F2F5FA" stroke-width="7"/>
        <path d="M18 104 q0 -30 39 -30 q39 0 39 30 z" fill="#FF2A85"/>
        <path d="M18 104 q0 -30 39 -30 l0 30 z" fill="#E01f72"/>
        <ellipse cx="57" cy="52" rx="34" ry="31" fill="#C49A6C"/>
        <ellipse cx="57" cy="52" rx="34" ry="31" fill="none" stroke="#A67C52" stroke-width="2"/>
        <circle cx="27" cy="34" r="8" fill="#C49A6C" stroke="#A67C52" stroke-width="2"/>
        <circle cx="87" cy="34" r="8" fill="#C49A6C" stroke="#A67C52" stroke-width="2"/>
        <ellipse cx="57" cy="63" rx="20" ry="15" fill="#FDF6E3"/>
        <path d="M40 46 q6 -7 12 0" fill="none" stroke="#2A1D1A" stroke-width="3.2" stroke-linecap="round"/>
        <path d="M62 46 q6 -7 12 0" fill="none" stroke="#2A1D1A" stroke-width="3.2" stroke-linecap="round"/>
        <ellipse cx="57" cy="55" rx="8" ry="5" fill="#5A3D2E"/>
        <path d="M50 60 q7 9 14 0" fill="none" stroke="#2A1D1A" stroke-width="3" stroke-linecap="round"/>
        <rect x="16" y="46" width="13" height="18" rx="6" fill="#FF2A85" stroke="#fff" stroke-width="2"/>
        <rect x="85" y="46" width="13" height="18" rx="6" fill="#FF2A85" stroke="#fff" stroke-width="2"/>
      </svg>
    </div>
    <h1 style="font-family:'Rubik';font-weight:800;font-size:1.5rem;margin:6px 0 0">היי, אני קפי</h1>
    <p style="color:#8A7668;font-weight:600;margin:0;font-size:.95rem;line-height:1.45;max-width:280px">נצא יחד למסע. קודם — בחרי דמות משלך וכמה דברים שאת אוהבת.</p>
  </div>

  <!-- avatar presets -->
  <div style="margin-top:22px">
    <div style="font-family:'Rubik';font-weight:700;font-size:.82rem;color:#8A7668;margin:0 2px 10px">בחרי אווטאר</div>
    <div style="display:flex;gap:12px;justify-content:center">
      <div style="width:64px;height:64px;border-radius:18px;overflow:hidden;border:3px solid #FF2A85;box-shadow:0 6px 14px -6px #FF2A85">
        <svg viewBox="0 0 64 64" width="100%" height="100%"><rect width="64" height="64" rx="16" fill="#FF7FB2"/><circle cx="32" cy="33" r="13" fill="#FBE3CE"/><path d="M17 31c0-11 7-15 15-15s15 4 15 15c-3-4-7-6-15-6s-12 2-15 6z" fill="#5A3D2E"/><circle cx="27" cy="33" r="2" fill="#3A2A2E"/><circle cx="37" cy="33" r="2" fill="#3A2A2E"/><path d="M28 39q4 3 8 0" fill="none" stroke="#C2506E" stroke-width="2" stroke-linecap="round"/></svg>
      </div>
      <div style="width:64px;height:64px;border-radius:18px;overflow:hidden;border:2px solid #EBDDCB">
        <svg viewBox="0 0 64 64" width="100%" height="100%"><rect width="64" height="64" rx="16" fill="#8FD9FB"/><circle cx="32" cy="33" r="13" fill="#F2D3B8"/><path d="M18 30c2-9 8-14 14-14s12 5 14 14c-1 6-3 9-3 9l-3-9c-3 3-13 3-16 0l-3 9s-2-3-3-9z" fill="#2A2320"/><circle cx="27" cy="33" r="2" fill="#3A2A2E"/><circle cx="37" cy="33" r="2" fill="#3A2A2E"/><path d="M28 39q4 3 8 0" fill="none" stroke="#B25B47" stroke-width="2" stroke-linecap="round"/></svg>
      </div>
      <div style="width:64px;height:64px;border-radius:18px;overflow:hidden;border:2px solid #EBDDCB">
        <svg viewBox="0 0 64 64" width="100%" height="100%"><rect width="64" height="64" rx="16" fill="#F6D24A"/><circle cx="32" cy="33" r="13" fill="#E9B892"/><path d="M18 33c0-12 7-17 14-17s14 5 14 17c-3-2-4-8-4-8s-2 4-10 4-9-3-9-3-2 3-5 7z" fill="#4A2E1C"/><circle cx="27" cy="33" r="2" fill="#3A2A2E"/><circle cx="37" cy="33" r="2" fill="#3A2A2E"/><path d="M28 39q4 3 8 0" fill="none" stroke="#8A4B32" stroke-width="2" stroke-linecap="round"/></svg>
      </div>
      <div style="width:64px;height:64px;border-radius:18px;display:grid;place-items:center;border:2px dashed #C49A6C;color:#A67C52;background:#FDF6E3">
        <svg class="i" style="font-size:24px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="6" x2="12" y2="18"/><line x1="6" y1="12" x2="18" y2="12"/></svg>
      </div>
    </div>
  </div>

  <!-- interests -->
  <div style="margin-top:22px">
    <div style="font-family:'Rubik';font-weight:700;font-size:.82rem;color:#8A7668;margin:0 2px 10px">מה מעניין אותך? (אפשר כמה)</div>
    <div style="display:flex;flex-wrap:wrap;gap:9px">
      <span style="background:#FF2A85;color:#fff;border:2px solid #FF2A85;border-radius:99px;padding:9px 15px;font-family:'Rubik';font-weight:600;font-size:.92rem">אופנה</span>
      <span style="background:#FF2A85;color:#fff;border:2px solid #FF2A85;border-radius:99px;padding:9px 15px;font-family:'Rubik';font-weight:600;font-size:.92rem">חיות</span>
      <span style="background:#FFFDF8;color:#3A2A2E;border:2px solid #EBDDCB;border-radius:99px;padding:9px 15px;font-family:'Rubik';font-weight:600;font-size:.92rem">יזמות</span>
      <span style="background:#FF2A85;color:#fff;border:2px solid #FF2A85;border-radius:99px;padding:9px 15px;font-family:'Rubik';font-weight:600;font-size:.92rem">בינה מלאכותית</span>
      <span style="background:#FFFDF8;color:#3A2A2E;border:2px solid #EBDDCB;border-radius:99px;padding:9px 15px;font-family:'Rubik';font-weight:600;font-size:.92rem">מוזיקה</span>
      <span style="background:#FFFDF8;color:#3A2A2E;border:2px solid #EBDDCB;border-radius:99px;padding:9px 15px;font-family:'Rubik';font-weight:600;font-size:.92rem">חלל</span>
      <span style="background:#FFFDF8;color:#3A2A2E;border:2px solid #EBDDCB;border-radius:99px;padding:9px 15px;font-family:'Rubik';font-weight:600;font-size:.92rem">ספורט</span>
    </div>
  </div>

  <!-- progress dots + cta -->
  <div style="margin-top:auto;display:flex;flex-direction:column;gap:14px;align-items:center">
    <div style="display:flex;gap:7px">
      <span style="width:9px;height:9px;border-radius:99px;background:#FF2A85"></span>
      <span style="width:9px;height:9px;border-radius:99px;background:#FF2A85"></span>
      <span style="width:9px;height:9px;border-radius:99px;background:#EBDDCB"></span>
      <span style="width:9px;height:9px;border-radius:99px;background:#EBDDCB"></span>
    </div>
    <div style="width:100%;border-radius:16px;padding:15px;font-family:'Rubik';font-weight:700;font-size:1.05rem;background:#FF2A85;color:#fff;text-align:center;box-shadow:0 10px 22px -10px #FF2A85">יאללה, מתחילים</div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic{ renderVals(){ return {}; } }
</script>
</body>
</html>
