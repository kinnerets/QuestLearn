<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&family=Assistant:wght@400;500;600;700&display=swap">
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:"Assistant",system-ui,sans-serif}
    a{color:#C21361}a:hover{color:#FF2A85}
    .i{width:1em;height:1em;display:block;flex:none}
  </style>
</helmet>

<div dir="rtl" style="width:390px;height:780px;background:#FBF3E9;color:#3A2A2E;font-family:'Assistant',sans-serif;display:flex;flex-direction:column;overflow:hidden">

  <!-- appbar -->
  <div style="padding:16px 16px 12px;display:flex;align-items:center;gap:12px;background:linear-gradient(180deg,#FFE3F0,#FFFDF8);border-bottom:1px solid #EBDDCB">
    <div style="width:46px;height:46px;border-radius:14px;overflow:hidden;border:2px solid #FFFDF8;box-shadow:0 4px 10px -3px #FF2A85">
      <svg viewBox="0 0 46 46" width="100%" height="100%" aria-label="אווטאר">
        <rect width="46" height="46" rx="14" fill="#FF7FB2"/>
        <circle cx="23" cy="24" r="9.5" fill="#FBE3CE"/>
        <path d="M12 22c0-8 5-11 11-11s11 3 11 11c-2-3-5-4-11-4s-9 1-11 4z" fill="#5A3D2E"/>
        <circle cx="19.5" cy="24" r="1.4" fill="#3A2A2E"/><circle cx="26.5" cy="24" r="1.4" fill="#3A2A2E"/>
        <path d="M20 28q3 2.4 6 0" fill="none" stroke="#C2506E" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
    </div>
    <div style="line-height:1.1">
      <div style="font-family:'Rubik';font-weight:700;font-size:1rem">מילי</div>
      <div style="font-size:.76rem;color:#8A7668;font-weight:600">כיתה ג׳</div>
    </div>
    <div style="display:flex;gap:8px;margin-inline-start:auto">
      <div style="display:flex;align-items:center;gap:5px;background:#FEF3C7;border:1px solid #EBDDCB;border-radius:99px;padding:6px 11px;font-family:'Rubik';font-weight:700;font-size:.9rem;color:#946A00">
        <svg class="i" style="font-size:15px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.4"/></svg>120
      </div>
      <div style="display:flex;align-items:center;gap:5px;background:#FFE3F0;border:1px solid #EBDDCB;border-radius:99px;padding:6px 11px;font-family:'Rubik';font-weight:700;font-size:.9rem;color:#C21361">
        <svg class="i" style="font-size:15px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3c1.4 3 4 4.2 4 7.5a4 4 0 0 1-8 0c0-1.6.7-2.8 1.6-3.7.2 1.7 1.9 1.8 1.9.2 0-1.7-.2-2.8.5-4z"/></svg>6
      </div>
    </div>
  </div>

  <!-- content -->
  <div style="flex:1;padding:16px 16px 10px;display:flex;flex-direction:column;overflow:hidden">
    <div style="display:flex;align-items:center;margin:0 2px 8px">
      <span style="font-family:'Rubik';font-weight:700;font-size:1.05rem">מפת המסע היומית</span>
      <span style="margin-inline-start:auto;font-weight:600;color:#8A7668;font-size:.8rem">0/4 הושלמו</span>
    </div>

    <!-- map -->
    <div style="position:relative;flex:1;min-height:400px">
      <svg viewBox="0 0 340 460" preserveAspectRatio="none" style="position:absolute;inset:0;width:100%;height:100%" aria-hidden="true">
        <path d="M60,42 C 250,72 60,150 150,190 C 250,230 90,300 150,340 C 210,375 120,410 250,432" fill="none" stroke="#E7CBA8" stroke-width="14" stroke-linecap="round" stroke-dasharray="2 22"/>
      </svg>

      <!-- node: core (active) -->
      <div style="position:absolute;right:8%;top:6%;transform:translate(-50%,-50%);width:120px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center">
        <div style="width:74px;height:74px;border-radius:24px;display:grid;place-items:center;color:#fff;background:linear-gradient(160deg,#FF5AA6,#FF2A85);box-shadow:0 10px 20px -8px rgba(58,42,46,.5),0 0 0 6px rgba(255,42,133,.18)">
          <svg class="i" style="font-size:34px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="3"/><line x1="8" y1="7.5" x2="16" y2="7.5"/><line x1="8.5" y1="12" x2="8.6" y2="12"/><line x1="12" y1="12" x2="12.1" y2="12"/><line x1="15.5" y1="12" x2="15.6" y2="12"/><line x1="8.5" y1="16" x2="8.6" y2="16"/><line x1="12" y1="16" x2="12.1" y2="16"/><line x1="15.5" y1="16" x2="15.6" y2="16"/></svg>
        </div>
        <div style="font-family:'Rubik';font-weight:600;font-size:.82rem">חשבון</div>
        <div style="font-size:.68rem;color:#8A7668;font-weight:600;margin-top:-3px">חובה · 2 דק׳</div>
      </div>

      <!-- node: lang -->
      <div style="position:absolute;right:52%;top:39%;transform:translate(-50%,-50%);width:120px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center">
        <div style="width:74px;height:74px;border-radius:24px;display:grid;place-items:center;color:#fff;background:linear-gradient(160deg,#6DD3FB,#38BDF8);box-shadow:0 10px 20px -8px rgba(58,42,46,.5)">
          <svg class="i" style="font-size:34px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6H8a2 2 0 0 0-2 2v5a2 2 0 0 0 2 2h1v3l4-3h7a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2z"/><line x1="10" y1="10.5" x2="18" y2="10.5"/></svg>
        </div>
        <div style="font-family:'Rubik';font-weight:600;font-size:.82rem">ערבית</div>
        <div style="font-size:.68rem;color:#8A7668;font-weight:600;margin-top:-3px">שפות · 2 דק׳</div>
      </div>

      <!-- node: future -->
      <div style="position:absolute;right:20%;top:71%;transform:translate(-50%,-50%);width:120px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center">
        <div style="width:74px;height:74px;border-radius:24px;display:grid;place-items:center;color:#fff;background:linear-gradient(160deg,#F6D24A,#E0A800);box-shadow:0 10px 20px -8px rgba(58,42,46,.5)">
          <svg class="i" style="font-size:34px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c2.6 2 3.8 5.4 3.8 8.4l-3.8 2.8-3.8-2.8C8.2 8.4 9.4 5 12 3z"/><path d="M9 14.5l-2 4M15 14.5l2 4"/><circle cx="12" cy="9" r="1.4"/></svg>
        </div>
        <div style="font-family:'Rubik';font-weight:600;font-size:.82rem">שער העתיד</div>
        <div style="font-size:.68rem;color:#8A7668;font-weight:600;margin-top:-3px">העשרה · 2 דק׳</div>
      </div>

      <!-- node: leadership -->
      <div style="position:absolute;right:70%;top:92%;transform:translate(-50%,-50%);width:120px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center">
        <div style="width:74px;height:74px;border-radius:24px;display:grid;place-items:center;color:#fff;background:linear-gradient(160deg,#C9A87F,#A67C52);box-shadow:0 10px 20px -8px rgba(58,42,46,.5)">
          <svg class="i" style="font-size:34px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-6.5-4.2-6.5-9A3.3 3.3 0 0 1 12 8a3.3 3.3 0 0 1 6.5 3c0 4.8-6.5 9-6.5 9z"/></svg>
        </div>
        <div style="font-family:'Rubik';font-weight:600;font-size:.82rem">בנק הלב</div>
        <div style="font-size:.68rem;color:#8A7668;font-weight:600;margin-top:-3px">מנהיגות · 1 דק׳</div>
      </div>
    </div>

    <!-- capi -->
    <div style="display:flex;align-items:flex-end;gap:10px;margin-top:4px">
      <div style="width:74px;height:74px;flex:none">
        <svg viewBox="0 0 114 114" width="100%" height="100%" aria-label="קפי">
          <path d="M22 52 a35 35 0 0 1 70 0" fill="none" stroke="#F2F5FA" stroke-width="7"/>
          <path d="M18 104 q0 -30 39 -30 q39 0 39 30 z" fill="#FF2A85"/>
          <path d="M18 104 q0 -30 39 -30 l0 30 z" fill="#E01f72"/>
          <ellipse cx="57" cy="52" rx="34" ry="31" fill="#C49A6C"/>
          <ellipse cx="57" cy="52" rx="34" ry="31" fill="none" stroke="#A67C52" stroke-width="2"/>
          <circle cx="27" cy="34" r="8" fill="#C49A6C" stroke="#A67C52" stroke-width="2"/>
          <circle cx="87" cy="34" r="8" fill="#C49A6C" stroke="#A67C52" stroke-width="2"/>
          <ellipse cx="57" cy="63" rx="20" ry="15" fill="#FDF6E3"/>
          <path d="M40 47 q6 4 12 0" fill="none" stroke="#2A1D1A" stroke-width="3.4" stroke-linecap="round"/>
          <path d="M62 47 q6 4 12 0" fill="none" stroke="#2A1D1A" stroke-width="3.4" stroke-linecap="round"/>
          <ellipse cx="57" cy="55" rx="8" ry="5" fill="#5A3D2E"/>
          <path d="M52 60 q5 4 10 0" fill="none" stroke="#2A1D1A" stroke-width="2.8" stroke-linecap="round"/>
          <rect x="16" y="46" width="13" height="18" rx="6" fill="#FF2A85" stroke="#fff" stroke-width="2"/>
          <rect x="85" y="46" width="13" height="18" rx="6" fill="#FF2A85" stroke="#fff" stroke-width="2"/>
        </svg>
      </div>
      <div style="background:#FDF6E3;border:1px solid #EBDDCB;border-radius:18px 18px 18px 5px;padding:10px 13px;font-size:.9rem;line-height:1.4;font-weight:600;flex:1">אהלן מילי. מוכנה למסע של היום? נתחיל ב<b style="color:#C21361">חשבון</b>.</div>
    </div>
  </div>

  <!-- bottom nav -->
  <div style="display:flex;border-top:1px solid #EBDDCB;background:#FFFDF8">
    <div style="flex:1;padding:9px 4px 11px;display:flex;flex-direction:column;align-items:center;gap:3px;color:#C21361;font-family:'Rubik';font-weight:600;font-size:.72rem">
      <svg class="i" style="font-size:21px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4L4 6v14l5-2 6 2 5-2V4l-5 2-6-2z"/><line x1="9" y1="4" x2="9" y2="18"/><line x1="15" y1="6" x2="15" y2="20"/></svg>מסע
    </div>
    <div style="flex:1;padding:9px 4px 11px;display:flex;flex-direction:column;align-items:center;gap:3px;color:#8A7668;font-family:'Rubik';font-weight:600;font-size:.72rem">
      <svg class="i" style="font-size:21px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="5" y1="20" x2="5" y2="11"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="19" y1="20" x2="19" y2="14"/></svg>המצב שלי
    </div>
    <div style="flex:1;padding:9px 4px 11px;display:flex;flex-direction:column;align-items:center;gap:3px;color:#8A7668;font-family:'Rubik';font-weight:600;font-size:.72rem">
      <svg class="i" style="font-size:21px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="9" width="16" height="11" rx="1"/><line x1="4" y1="13" x2="20" y2="13"/><line x1="12" y1="9" x2="12" y2="20"/><path d="M12 9C11 6 8 6 8 8s3 1 4 1zM12 9c1-3 4-3 4-1s-3 1-4 1z"/></svg>חנות
    </div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic{ renderVals(){ return {}; } }
</script>
</body>
</html>
