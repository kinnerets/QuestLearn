<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&family=Assistant:wght@400;500;600;700&display=swap">
  <style>*{box-sizing:border-box}body{margin:0;font-family:"Assistant",system-ui,sans-serif}a{color:#C21361}a:hover{color:#FF2A85}.i{width:1em;height:1em;display:block;flex:none}</style>
</helmet>

<div dir="rtl" style="width:390px;height:780px;background:#F7F2EC;color:#3A2A2E;font-family:'Assistant',sans-serif;display:flex;flex-direction:column;overflow:hidden">

  <!-- pink greeting hero -->
  <div style="margin:14px 14px 0;background:linear-gradient(150deg,#FF4E97,#C21361);border-radius:26px;padding:16px 18px;color:#fff;position:relative;overflow:hidden;box-shadow:0 16px 30px -16px rgba(194,19,97,.7)">
    <div style="position:absolute;left:-26px;top:-26px;width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.12)"></div>
    <div style="display:flex;align-items:center;gap:13px;position:relative">
      <div style="width:52px;height:52px;border-radius:16px;overflow:hidden;background:#FFE0EC;border:2px solid rgba(255,255,255,.6);flex:none">
        <svg viewBox="46 32 108 108" width="100%" height="100%" aria-label="אווטאר"><path d="M34 200 C34 156 62 138 100 138 C138 138 166 156 166 200 Z" fill="#38BDF8"/><path d="M84 140 L100 156 L116 140 Z" fill="#1F9ED4"/><path d="M88 118 h24 v16 a12 12 0 0 1 -24 0 Z" fill="#F3C9A3"/><path d="M52 94 C52 52 74 34 100 34 C126 34 148 52 148 94 L148 152 C140 146 132 144 126 144 L74 144 C68 144 60 146 52 152 Z" fill="#7A4B2B"/><circle cx="62" cy="98" r="9" fill="#FCE0C8"/><circle cx="138" cy="98" r="9" fill="#FCE0C8"/><ellipse cx="100" cy="94" rx="40" ry="44" fill="#FCE0C8"/><path d="M60 82 C64 50 82 40 100 40 C118 40 136 50 140 82 C128 66 116 60 100 60 C84 60 72 66 60 82 Z" fill="#7A4B2B"/><path d="M76 86 q9 -5 18 -1" fill="none" stroke="#5A3D2E" stroke-width="3" stroke-linecap="round"/><path d="M106 85 q9 -4 18 1" fill="none" stroke="#5A3D2E" stroke-width="3" stroke-linecap="round"/><circle cx="84" cy="98" r="6" fill="#3A2A2E"/><circle cx="116" cy="98" r="6" fill="#3A2A2E"/><circle cx="86" cy="96" r="2" fill="#fff"/><circle cx="118" cy="96" r="2" fill="#fff"/><ellipse cx="74" cy="110" rx="7" ry="4.5" fill="#FF9FBE" opacity=".55"/><ellipse cx="126" cy="110" rx="7" ry="4.5" fill="#FF9FBE" opacity=".55"/><path d="M86 116 q14 11 28 0" fill="none" stroke="#C2506E" stroke-width="3.4" stroke-linecap="round"/><path d="M128 44 l14 -6 0 14 z" fill="#FF2A85"/><path d="M128 44 l14 6 0 -14 z" fill="#FF2A85"/><circle cx="128" cy="44" r="4.5" fill="#C21361"/></svg>
      </div>
      <div style="flex:1">
        <div style="font-family:'Rubik';font-weight:800;font-size:1.3rem;line-height:1.1">בוקר טוב, מילי</div>
        <div style="font-weight:600;font-size:.86rem;opacity:.92;margin-top:2px">4 תחנות היום · בערך 8 דקות</div>
      </div>
      <div style="width:54px;height:54px;flex:none;position:relative">
        <svg viewBox="0 0 42 42" width="54" height="54"><circle cx="21" cy="21" r="17" fill="none" stroke="rgba(255,255,255,.25)" stroke-width="5"/><circle cx="21" cy="21" r="17" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-dasharray="107" stroke-dashoffset="80" transform="rotate(-90 21 21)"/></svg>
        <div style="position:absolute;inset:0;display:grid;place-items:center;font-family:'Rubik';font-weight:800;font-size:.78rem">0/4</div>
      </div>
    </div>
  </div>

  <!-- coin + streak rectangles -->
  <div style="display:flex;gap:12px;padding:12px 14px 4px">
    <div style="flex:1;background:#FFFDF8;border:1px solid #EBDDCB;border-radius:16px;padding:12px 14px;display:flex;align-items:center;gap:10px">
      <svg class="i" style="font-size:22px;color:#946A00" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.4"/></svg>
      <div><div style="font-family:'Rubik';font-weight:800;font-size:1.1rem">120</div><div style="font-size:.7rem;color:#8A7668;font-weight:600">מטבעות</div></div>
    </div>
    <div style="flex:1;background:#FFFDF8;border:1px solid #EBDDCB;border-radius:16px;padding:12px 14px;display:flex;align-items:center;gap:10px">
      <svg class="i" style="font-size:22px;color:#C21361" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3c1.4 3 4 4.2 4 7.5a4 4 0 0 1-8 0c0-1.6.7-2.8 1.6-3.7.2 1.7 1.9 1.8 1.9.2 0-1.7-.2-2.8.5-4z"/></svg>
      <div><div style="font-family:'Rubik';font-weight:800;font-size:1.1rem">6</div><div style="font-size:.7rem;color:#8A7668;font-weight:600">ימי רצף</div></div>
    </div>
  </div>

  <!-- subject mission cards -->
  <div style="flex:1;padding:8px 14px 12px;display:flex;flex-direction:column;gap:10px;overflow-y:auto">
    <div style="display:flex;align-items:center;gap:13px;background:#FFFDF8;border:2px solid #FF2A85;border-radius:20px;padding:13px;box-shadow:0 10px 24px -14px rgba(255,42,133,.5)">
      <div style="width:50px;height:50px;border-radius:15px;display:grid;place-items:center;color:#fff;background:linear-gradient(160deg,#FF5AA6,#FF2A85);flex:none"><svg class="i" style="font-size:25px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="3"/><line x1="8" y1="7.5" x2="16" y2="7.5"/><line x1="8.5" y1="12" x2="8.6" y2="12"/><line x1="12" y1="12" x2="12.1" y2="12"/><line x1="15.5" y1="12" x2="15.6" y2="12"/></svg></div>
      <div style="flex:1"><div style="font-family:'Rubik';font-weight:700;font-size:1rem">חשבון — לוח הכפל</div><div style="font-size:.78rem;color:#8A7668;font-weight:600">חובה · 2 דקות</div></div>
      <span style="background:#FF2A85;color:#fff;border-radius:12px;padding:9px 15px;font-family:'Rubik';font-weight:700;font-size:.84rem">התחילי</span>
    </div>
    <div style="display:flex;align-items:center;gap:13px;background:#FFFDF8;border:1px solid #EBDDCB;border-radius:20px;padding:13px">
      <div style="width:50px;height:50px;border-radius:15px;display:grid;place-items:center;color:#fff;background:linear-gradient(160deg,#6DD3FB,#38BDF8);flex:none"><svg class="i" style="font-size:23px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6H8a2 2 0 0 0-2 2v5a2 2 0 0 0 2 2h1v3l4-3h7a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2z"/><line x1="10" y1="10.5" x2="18" y2="10.5"/></svg></div>
      <div style="flex:1"><div style="font-family:'Rubik';font-weight:700;font-size:1rem">ערבית — ברכות</div><div style="font-size:.78rem;color:#8A7668;font-weight:600">שפות · 2 דקות</div></div>
      <svg class="i" style="font-size:19px;color:#C4B3A3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
    </div>
    <div style="display:flex;align-items:center;gap:13px;background:#FFFDF8;border:1px solid #EBDDCB;border-radius:20px;padding:13px">
      <div style="width:50px;height:50px;border-radius:15px;display:grid;place-items:center;color:#fff;background:linear-gradient(160deg,#F6D24A,#E0A800);flex:none"><svg class="i" style="font-size:23px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c2.6 2 3.8 5.4 3.8 8.4l-3.8 2.8-3.8-2.8C8.2 8.4 9.4 5 12 3z"/><path d="M9 14.5l-2 4M15 14.5l2 4"/><circle cx="12" cy="9" r="1.4"/></svg></div>
      <div style="flex:1"><div style="font-family:'Rubik';font-weight:700;font-size:1rem">שער העתיד — אופנה</div><div style="font-size:.78rem;color:#8A7668;font-weight:600">העשרה · 2 דקות</div></div>
      <svg class="i" style="font-size:17px;color:#C4B3A3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
    </div>
    <div style="display:flex;align-items:center;gap:13px;background:#FFFDF8;border:1px solid #EBDDCB;border-radius:20px;padding:13px">
      <div style="width:50px;height:50px;border-radius:15px;display:grid;place-items:center;color:#fff;background:linear-gradient(160deg,#C9A87F,#A67C52);flex:none"><svg class="i" style="font-size:23px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-6.5-4.2-6.5-9A3.3 3.3 0 0 1 12 8a3.3 3.3 0 0 1 6.5 3c0 4.8-6.5 9-6.5 9z"/></svg></div>
      <div style="flex:1"><div style="font-family:'Rubik';font-weight:700;font-size:1rem">בנק הלב — הפקדה</div><div style="font-size:.78rem;color:#8A7668;font-weight:600">מנהיגות · 1 דקה</div></div>
      <svg class="i" style="font-size:17px;color:#C4B3A3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
    </div>
  </div>

  <div style="display:flex;border-top:1px solid #EBDDCB;background:#FFFDF8">
    <div style="flex:1;padding:9px 4px 11px;display:flex;flex-direction:column;align-items:center;gap:3px;color:#C21361;font-family:'Rubik';font-weight:600;font-size:.72rem"><svg class="i" style="font-size:21px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4L4 6v14l5-2 6 2 5-2V4l-5 2-6-2z"/><line x1="9" y1="4" x2="9" y2="18"/><line x1="15" y1="6" x2="15" y2="20"/></svg>מסע</div>
    <div style="flex:1;padding:9px 4px 11px;display:flex;flex-direction:column;align-items:center;gap:3px;color:#8A7668;font-family:'Rubik';font-weight:600;font-size:.72rem"><svg class="i" style="font-size:21px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="5" y1="20" x2="5" y2="11"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="19" y1="20" x2="19" y2="14"/></svg>המצב שלי</div>
    <div style="flex:1;padding:9px 4px 11px;display:flex;flex-direction:column;align-items:center;gap:3px;color:#8A7668;font-family:'Rubik';font-weight:600;font-size:.72rem"><svg class="i" style="font-size:21px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="9" width="16" height="11" rx="1"/><line x1="4" y1="13" x2="20" y2="13"/><line x1="12" y1="9" x2="12" y2="20"/><path d="M12 9C11 6 8 6 8 8s3 1 4 1zM12 9c1-3 4-3 4-1s-3 1-4 1z"/></svg>חנות</div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic{ renderVals(){ return {}; } }
</script>
</body>
</html>
