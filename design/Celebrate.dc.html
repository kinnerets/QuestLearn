<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&family=Assistant:wght@400;500;600;700&display=swap">
  <style>*{box-sizing:border-box}body{margin:0;font-family:"Assistant",system-ui,sans-serif}a{color:#C21361}a:hover{color:#FF2A85}.i{width:1em;height:1em;display:block;flex:none}</style>
</helmet>

<div dir="rtl" style="width:390px;height:780px;background:radial-gradient(120% 60% at 50% 0%,#FFE3F0,#FBF3E9 60%);color:#3A2A2E;font-family:'Assistant',sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;overflow:hidden;position:relative">

  <!-- confetti (decorative) -->
  <div style="position:absolute;inset:0;pointer-events:none">
    <div style="position:absolute;top:60px;left:40px;width:9px;height:14px;border-radius:2px;background:#FF2A85;transform:rotate(20deg)"></div>
    <div style="position:absolute;top:110px;right:50px;width:9px;height:14px;border-radius:2px;background:#FACC15;transform:rotate(-30deg)"></div>
    <div style="position:absolute;top:180px;left:70px;width:9px;height:14px;border-radius:2px;background:#38BDF8;transform:rotate(45deg)"></div>
    <div style="position:absolute;top:90px;left:170px;width:9px;height:14px;border-radius:2px;background:#2FBF8F;transform:rotate(-15deg)"></div>
    <div style="position:absolute;top:150px;right:90px;width:9px;height:14px;border-radius:2px;background:#C49A6C;transform:rotate(60deg)"></div>
    <div style="position:absolute;top:70px;right:120px;width:9px;height:14px;border-radius:2px;background:#FF2A85;transform:rotate(-45deg)"></div>
  </div>

  <div style="width:132px;height:132px">
    <svg viewBox="0 0 114 114" width="100%" height="100%" aria-label="קפי חוגגת">
      <path d="M22 52 a35 35 0 0 1 70 0" fill="none" stroke="#F2F5FA" stroke-width="7"/>
      <path d="M18 104 q0 -30 39 -30 q39 0 39 30 z" fill="#FF2A85"/>
      <path d="M18 104 q0 -30 39 -30 l0 30 z" fill="#E01f72"/>
      <ellipse cx="57" cy="52" rx="34" ry="31" fill="#C49A6C"/>
      <ellipse cx="57" cy="52" rx="34" ry="31" fill="none" stroke="#A67C52" stroke-width="2"/>
      <circle cx="27" cy="34" r="8" fill="#C49A6C" stroke="#A67C52" stroke-width="2"/>
      <circle cx="87" cy="34" r="8" fill="#C49A6C" stroke="#A67C52" stroke-width="2"/>
      <ellipse cx="57" cy="63" rx="20" ry="15" fill="#FDF6E3"/>
      <path d="M40 46 q6 -7 12 0" fill="none" stroke="#2A1D1A" stroke-width="3.2" stroke-linecap="round"/>
      <path d="M62 46 q6 -7 12 0" fill="none" stroke="#2A1D1A" stroke-width="3.2" stroke-linecap="round"/>
      <ellipse cx="57" cy="55" rx="8" ry="5" fill="#5A3D2E"/>
      <path d="M50 60 q7 9 14 0" fill="none" stroke="#2A1D1A" stroke-width="3" stroke-linecap="round"/>
      <rect x="16" y="46" width="13" height="18" rx="6" fill="#FF2A85" stroke="#fff" stroke-width="2"/>
      <rect x="85" y="46" width="13" height="18" rx="6" fill="#FF2A85" stroke="#fff" stroke-width="2"/>
    </svg>
  </div>

  <h2 style="font-family:'Rubik';font-weight:800;font-size:1.55rem;margin:14px 0 4px">סיימת את המסע היומי</h2>
  <p style="color:#8A7668;margin:0 0 16px;font-weight:600;display:flex;align-items:center;gap:6px">הרצף שלך עלה ל‑7 ימים
    <svg class="i" style="font-size:18px;color:#FF2A85" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3c1.4 3 4 4.2 4 7.5a4 4 0 0 1-8 0c0-1.6.7-2.8 1.6-3.7.2 1.7 1.9 1.8 1.9.2 0-1.7-.2-2.8.5-4z"/></svg>
  </p>

  <div style="display:flex;gap:10px;margin:6px 0 18px">
    <div style="background:#FFFDF8;border:1px solid #EBDDCB;border-radius:16px;padding:12px 16px;min-width:96px">
      <b style="display:flex;align-items:center;justify-content:center;gap:4px;font-family:'Rubik';font-weight:800;font-size:1.35rem;color:#946A00"><svg class="i" style="font-size:19px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.4"/></svg>+30</b>
      <span style="font-size:.75rem;color:#8A7668;font-weight:600">מטבעות</span>
    </div>
    <div style="background:#FFFDF8;border:1px solid #EBDDCB;border-radius:16px;padding:12px 16px;min-width:96px">
      <b style="font-family:'Rubik';font-weight:800;font-size:1.35rem;display:block">+45</b>
      <span style="font-size:.75rem;color:#8A7668;font-weight:600">XP לאווטאר</span>
    </div>
    <div style="background:#FFFDF8;border:1px solid #EBDDCB;border-radius:16px;padding:12px 16px;min-width:96px">
      <b style="display:flex;justify-content:center;font-family:'Rubik';font-weight:800;font-size:1.35rem;color:#FF2A85"><svg class="i" style="font-size:22px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-6.5-4.2-6.5-9A3.3 3.3 0 0 1 12 8a3.3 3.3 0 0 1 6.5 3c0 4.8-6.5 9-6.5 9z"/></svg></b>
      <span style="font-size:.75rem;color:#8A7668;font-weight:600">הפקדה ללב</span>
    </div>
  </div>

  <div style="border-radius:16px;padding:14px 26px;font-family:'Rubik';font-weight:700;font-size:1.05rem;background:#FDF6E3;color:#3A2A2E;border:1px solid #EBDDCB">למסע חדש</div>
</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic{ renderVals(){ return {}; } }
</script>
</body>
</html>
