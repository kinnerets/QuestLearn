<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&family=Assistant:wght@400;500;600;700&display=swap">
  <style>*{box-sizing:border-box}body{margin:0;font-family:"Assistant",system-ui,sans-serif}a{color:#C21361}a:hover{color:#FF2A85}.i{width:1em;height:1em;display:block;flex:none}</style>
</helmet>

<div dir="rtl" style="width:390px;height:780px;background:#FBF3E9;color:#3A2A2E;font-family:'Assistant',sans-serif;display:flex;flex-direction:column;overflow:hidden">
  <div style="padding:16px 16px 12px;display:flex;align-items:center;gap:12px;background:linear-gradient(180deg,#FEF3C7,#FFFDF8);border-bottom:1px solid #EBDDCB">
    <div style="width:46px;height:46px;border-radius:14px;overflow:hidden;border:2px solid #FFFDF8;box-shadow:0 4px 10px -3px #FACC15">
      <svg viewBox="0 0 46 46" width="100%" height="100%" aria-label="אווטאר"><rect width="46" height="46" rx="14" fill="#FF7FB2"/><circle cx="23" cy="24" r="9.5" fill="#FBE3CE"/><path d="M12 22c0-8 5-11 11-11s11 3 11 11c-2-3-5-4-11-4s-9 1-11 4z" fill="#5A3D2E"/><circle cx="19.5" cy="24" r="1.4" fill="#3A2A2E"/><circle cx="26.5" cy="24" r="1.4" fill="#3A2A2E"/><path d="M20 28q3 2.4 6 0" fill="none" stroke="#C2506E" stroke-width="1.6" stroke-linecap="round"/></svg>
    </div>
    <div style="line-height:1.1"><div style="font-family:'Rubik';font-weight:700;font-size:1rem">מילי</div><div style="font-size:.76rem;color:#8A7668;font-weight:600">כיתה ג׳</div></div>
    <div style="margin-inline-start:auto;display:flex;align-items:center;gap:5px;background:#FEF3C7;border:1px solid #EBDDCB;border-radius:99px;padding:6px 11px;font-family:'Rubik';font-weight:700;font-size:.9rem;color:#946A00"><svg class="i" style="font-size:15px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.4"/></svg>150</div>
  </div>

  <div style="flex:1;padding:16px;display:flex;flex-direction:column;overflow:hidden">
    <div style="display:flex;align-items:center;margin:0 2px 12px"><span style="font-family:'Rubik';font-weight:700;font-size:1.05rem">חנות הפרסים</span><span style="margin-inline-start:auto;font-weight:600;color:#8A7668;font-size:.8rem">המשפחתית</span></div>

    <!-- voucher -->
    <div style="display:flex;align-items:center;gap:10px;background:#EAF9F2;border:1px dashed #2FBF8F;border-radius:14px;padding:12px;margin-bottom:12px;font-weight:600;font-size:.9rem">
      <svg class="i" style="font-size:20px;color:#2FBF8F" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg>
      <div>מומש! הצגי להורה את השובר <b style="font-family:'Rubik'">QL-7F2A</b></div>
    </div>

    <!-- reward: ready -->
    <div style="display:flex;gap:12px;align-items:center;background:#FDF6E3;border:1px solid #EBDDCB;border-radius:16px;padding:12px;margin-bottom:10px">
      <div style="width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:#FEF0C4;color:#946A00"><svg class="i" style="font-size:22px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="12" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg></div>
      <div style="flex:1;min-width:0"><b style="font-family:'Rubik';font-weight:700;font-size:.98rem">חצי שעה זמן מסך</b><div style="height:7px;border-radius:99px;background:#EBDDCB;overflow:hidden;margin-top:6px"><i style="display:block;height:100%;width:100%;background:#FACC15;border-radius:99px"></i></div><span style="font-size:.75rem;color:#8A7668;font-weight:600">150 / 150 מטבעות</span></div>
      <div style="border-radius:12px;padding:9px 13px;font-family:'Rubik';font-weight:700;font-size:.82rem;background:#FF2A85;color:#fff">מימוש</div>
    </div>

    <!-- reward: near -->
    <div style="display:flex;gap:12px;align-items:center;background:#FDF6E3;border:1px solid #EBDDCB;border-radius:16px;padding:12px;margin-bottom:10px">
      <div style="width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:#FEF0C4;color:#946A00"><svg class="i" style="font-size:22px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-6 8 6"/><path d="M6 10v9h12v-9"/></svg></div>
      <div style="flex:1;min-width:0"><b style="font-family:'Rubik';font-weight:700;font-size:.98rem">ערב סרטים משפחתי</b><div style="height:7px;border-radius:99px;background:#EBDDCB;overflow:hidden;margin-top:6px"><i style="display:block;height:100%;width:80%;background:#FACC15;border-radius:99px"></i></div><span style="font-size:.75rem;color:#8A7668;font-weight:600">120 / 150 מטבעות</span></div>
      <div style="border-radius:12px;padding:9px 13px;font-family:'Rubik';font-weight:700;font-size:.82rem;background:#FFFDF8;color:#8A7668;border:1px solid #EBDDCB">עוד 30</div>
    </div>

    <!-- reward: far -->
    <div style="display:flex;gap:12px;align-items:center;background:#FDF6E3;border:1px solid #EBDDCB;border-radius:16px;padding:12px;margin-bottom:10px">
      <div style="width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:#FEF0C4;color:#946A00"><svg class="i" style="font-size:22px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4l2.2 4.6 5 .7-3.6 3.6.9 5-4.5-2.4L7.5 18l.9-5L4.8 9.3l5-.7z"/></svg></div>
      <div style="flex:1;min-width:0"><b style="font-family:'Rubik';font-weight:700;font-size:.98rem">לבחור את ארוחת הערב</b><div style="height:7px;border-radius:99px;background:#EBDDCB;overflow:hidden;margin-top:6px"><i style="display:block;height:100%;width:60%;background:#FACC15;border-radius:99px"></i></div><span style="font-size:.75rem;color:#8A7668;font-weight:600">120 / 200 מטבעות</span></div>
      <div style="border-radius:12px;padding:9px 13px;font-family:'Rubik';font-weight:700;font-size:.82rem;background:#FFFDF8;color:#8A7668;border:1px solid #EBDDCB">עוד 80</div>
    </div>

    <p style="color:#8A7668;font-size:.8rem;font-weight:600;margin:6px 2px 0">המימוש אוטומטי — לא צריך אישור הורה. נוצר שובר שמציגים בבית.</p>
    <div style="margin-top:auto"></div>
  </div>

  <div style="display:flex;border-top:1px solid #EBDDCB;background:#FFFDF8">
    <div style="flex:1;padding:9px 4px 11px;display:flex;flex-direction:column;align-items:center;gap:3px;color:#8A7668;font-family:'Rubik';font-weight:600;font-size:.72rem"><svg class="i" style="font-size:21px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4L4 6v14l5-2 6 2 5-2V4l-5 2-6-2z"/><line x1="9" y1="4" x2="9" y2="18"/><line x1="15" y1="6" x2="15" y2="20"/></svg>מסע</div>
    <div style="flex:1;padding:9px 4px 11px;display:flex;flex-direction:column;align-items:center;gap:3px;color:#8A7668;font-family:'Rubik';font-weight:600;font-size:.72rem"><svg class="i" style="font-size:21px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="5" y1="20" x2="5" y2="11"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="19" y1="20" x2="19" y2="14"/></svg>המצב שלי</div>
    <div style="flex:1;padding:9px 4px 11px;display:flex;flex-direction:column;align-items:center;gap:3px;color:#C21361;font-family:'Rubik';font-weight:600;font-size:.72rem"><svg class="i" style="font-size:21px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="9" width="16" height="11" rx="1"/><line x1="4" y1="13" x2="20" y2="13"/><line x1="12" y1="9" x2="12" y2="20"/><path d="M12 9C11 6 8 6 8 8s3 1 4 1zM12 9c1-3 4-3 4-1s-3 1-4 1z"/></svg>חנות</div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic{ renderVals(){ return {}; } }
</script>
</body>
</html>
