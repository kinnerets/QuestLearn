<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&family=Assistant:wght@400;500;600;700&display=swap">
  <style>*{box-sizing:border-box}body{margin:0;font-family:"Assistant",system-ui,sans-serif}a{color:#C21361}a:hover{color:#FF2A85}.i{width:1em;height:1em;display:block;flex:none}</style>
</helmet>

<div dir="rtl" style="width:390px;height:780px;background:#F7F2EC;color:#3A2A2E;font-family:'Assistant',sans-serif;display:flex;flex-direction:column;overflow:hidden">

  <!-- header + capi greeting -->
  <div style="padding:18px 16px 14px;background:#FFFDF8;border-bottom:1px solid #EBDDCB">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px">
      <div style="width:44px;height:44px;border-radius:14px;overflow:hidden">
        <svg viewBox="0 0 64 64" width="100%" height="100%" aria-label="אווטאר"><rect width="64" height="64" rx="18" fill="#FFE0EC"/><path d="M16 34 C16 18 24 13 32 13 C40 13 48 18 48 34 L48 50 L42 50 L42 34 C42 30 38 27 32 27 C26 27 22 30 22 34 L22 50 L16 50 Z" fill="#7A4B2B"/><circle cx="32" cy="32" r="13" fill="#FCE0C8"/><path d="M20 27 C22 21 27 19 32 19 C37 19 42 21 44 27 C40 24 36 23 32 23 C28 23 24 24 20 27 Z" fill="#7A4B2B"/><circle cx="25" cy="35" r="3" fill="#FF9FBE" opacity=".5"/><circle cx="39" cy="35" r="3" fill="#FF9FBE" opacity=".5"/><circle cx="27" cy="31" r="2.4" fill="#3A2A2E"/><circle cx="37" cy="31" r="2.4" fill="#3A2A2E"/><path d="M28 37 q4 3 8 0" fill="none" stroke="#C2506E" stroke-width="1.8" stroke-linecap="round"/></svg>
      </div>
      <div style="line-height:1.15"><div style="font-family:'Rubik';font-weight:800;font-size:1.1rem">בוקר טוב, מילי</div><div style="font-size:.8rem;color:#8A7668;font-weight:600">4 תחנות היום · בערך 8 דקות</div></div>
      <div style="margin-inline-start:auto;display:flex;flex-direction:column;align-items:center;gap:1px">
        <div style="display:flex;align-items:center;gap:4px;font-family:'Rubik';font-weight:800;font-size:1.05rem;color:#C21361"><svg class="i" style="font-size:16px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3c1.4 3 4 4.2 4 7.5a4 4 0 0 1-8 0c0-1.6.7-2.8 1.6-3.7.2 1.7 1.9 1.8 1.9.2 0-1.7-.2-2.8.5-4z"/></svg>6</div>
        <div style="font-size:.66rem;color:#8A7668;font-weight:600">ימי רצף</div>
      </div>
    </div>
    <!-- day progress -->
    <div style="height:8px;border-radius:99px;background:#EBDDCB;overflow:hidden"><i style="display:block;height:100%;width:0%;border-radius:99px;background:#FF2A85"></i></div>
  </div>

  <!-- mission cards -->
  <div style="flex:1;padding:14px 16px;display:flex;flex-direction:column;gap:11px;overflow-y:auto">
    <!-- active -->
    <div style="display:flex;align-items:center;gap:13px;background:#FFFDF8;border:2px solid #FF2A85;border-radius:20px;padding:14px;box-shadow:0 10px 24px -14px rgba(255,42,133,.5)">
      <div style="width:52px;height:52px;border-radius:16px;display:grid;place-items:center;color:#fff;background:linear-gradient(160deg,#FF5AA6,#FF2A85);flex:none"><svg class="i" style="font-size:26px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="3"/><line x1="8" y1="7.5" x2="16" y2="7.5"/><line x1="8.5" y1="12" x2="8.6" y2="12"/><line x1="12" y1="12" x2="12.1" y2="12"/><line x1="15.5" y1="12" x2="15.6" y2="12"/><line x1="8.5" y1="16" x2="8.6" y2="16"/><line x1="12" y1="16" x2="12.1" y2="16"/><line x1="15.5" y1="16" x2="15.6" y2="16"/></svg></div>
      <div style="flex:1"><div style="font-family:'Rubik';font-weight:700;font-size:1.02rem">חשבון — לוח הכפל</div><div style="font-size:.8rem;color:#8A7668;font-weight:600">חובה · 2 דקות</div></div>
      <span style="background:#FF2A85;color:#fff;border-radius:12px;padding:9px 15px;font-family:'Rubik';font-weight:700;font-size:.85rem">התחילי</span>
    </div>
    <!-- next -->
    <div style="display:flex;align-items:center;gap:13px;background:#FFFDF8;border:1px solid #EBDDCB;border-radius:20px;padding:14px">
      <div style="width:52px;height:52px;border-radius:16px;display:grid;place-items:center;color:#fff;background:linear-gradient(160deg,#6DD3FB,#38BDF8);flex:none"><svg class="i" style="font-size:24px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6H8a2 2 0 0 0-2 2v5a2 2 0 0 0 2 2h1v3l4-3h7a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2z"/><line x1="10" y1="10.5" x2="18" y2="10.5"/></svg></div>
      <div style="flex:1"><div style="font-family:'Rubik';font-weight:700;font-size:1.02rem">ערבית — ברכות</div><div style="font-size:.8rem;color:#8A7668;font-weight:600">שפות · 2 דקות</div></div>
      <svg class="i" style="font-size:20px;color:#C4B3A3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
    </div>
    <div style="display:flex;align-items:center;gap:13px;background:#FFFDF8;border:1px solid #EBDDCB;border-radius:20px;padding:14px">
      <div style="width:52px;height:52px;border-radius:16px;display:grid;place-items:center;color:#fff;background:linear-gradient(160deg,#F6D24A,#E0A800);flex:none"><svg class="i" style="font-size:24px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c2.6 2 3.8 5.4 3.8 8.4l-3.8 2.8-3.8-2.8C8.2 8.4 9.4 5 12 3z"/><path d="M9 14.5l-2 4M15 14.5l2 4"/><circle cx="12" cy="9" r="1.4"/></svg></div>
      <div style="flex:1"><div style="font-family:'Rubik';font-weight:700;font-size:1.02rem">שער העתיד — אופנה</div><div style="font-size:.8rem;color:#8A7668;font-weight:600">העשרה · 2 דקות</div></div>
      <svg class="i" style="font-size:18px;color:#C4B3A3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
    </div>
    <div style="display:flex;align-items:center;gap:13px;background:#FFFDF8;border:1px solid #EBDDCB;border-radius:20px;padding:14px">
      <div style="width:52px;height:52px;border-radius:16px;display:grid;place-items:center;color:#fff;background:linear-gradient(160deg,#C9A87F,#A67C52);flex:none"><svg class="i" style="font-size:24px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-6.5-4.2-6.5-9A3.3 3.3 0 0 1 12 8a3.3 3.3 0 0 1 6.5 3c0 4.8-6.5 9-6.5 9z"/></svg></div>
      <div style="flex:1"><div style="font-family:'Rubik';font-weight:700;font-size:1.02rem">בנק הלב — הפקדה</div><div style="font-size:.8rem;color:#8A7668;font-weight:600">מנהיגות · 1 דקה</div></div>
      <svg class="i" style="font-size:18px;color:#C4B3A3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
    </div>
  </div>

  <div style="display:flex;border-top:1px solid #EBDDCB;background:#FFFDF8">
    <div style="flex:1;padding:9px 4px 11px;display:flex;flex-direction:column;align-items:center;gap:3px;color:#C21361;font-family:'Rubik';font-weight:600;font-size:.72rem"><svg class="i" style="font-size:21px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4L4 6v14l5-2 6 2 5-2V4l-5 2-6-2z"/><line x1="9" y1="4" x2="9" y2="18"/><line x1="15" y1="6" x2="15" y2="20"/></svg>מסע</div>
    <div style="flex:1;padding:9px 4px 11px;display:flex;flex-direction:column;align-items:center;gap:3px;color:#8A7668;font-family:'Rubik';font-weight:600;font-size:.72rem"><svg class="i" style="font-size:21px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="5" y1="20" x2="5" y2="11"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="19" y1="20" x2="19" y2="14"/></svg>המצב שלי</div>
    <div style="flex:1;padding:9px 4px 11px;display:flex;flex-direction:column;align-items:center;gap:3px;color:#8A7668;font-family:'Rubik';font-weight:600;font-size:.72rem"><svg class="i" style="font-size:21px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="9" width="16" height="11" rx="1"/><line x1="4" y1="13" x2="20" y2="13"/><line x1="12" y1="9" x2="12" y2="20"/><path d="M12 9C11 6 8 6 8 8s3 1 4 1zM12 9c1-3 4-3 4-1s-3 1-4 1z"/></svg>חנות</div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic{ renderVals(){ return {}; } }
</script>
</body>
</html>
